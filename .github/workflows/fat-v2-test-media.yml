# SPDX-License-Identifier: GPL-3.0-or-later
name: FAT Common V2 fragmented Test Media qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fat-test-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native build and assertion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev jq
      - name: Obtain the published authoritative FAT modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p module-root/Filesystems
          for bits in 12 16 32; do
            mkdir -p "dist/$bits" "pkg/$bits"
            gh release download -R "Infiltrator-Projects/Filesystem-FAT$bits" -p '*.deb' -D "dist/$bits"
            test "$(find "dist/$bits" -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
            dpkg-deb -x "dist/$bits/"*.deb "pkg/$bits"
            install -m 0644 "pkg/$bits/System/Filesystems/FAT$bits.so" "module-root/Filesystems/FAT$bits.so"
          done
      - name: Build production mapper and isolated Common V2 consumers
        run: |
          cmake -S defragger -B defragger/build-fat-media -DBUILD_TESTING=ON -DLD_ENABLE_WERROR=ON -DCMAKE_BUILD_TYPE=Release -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/module-root" -DFAT_DEFRAG_TEST_MODULE_PARENT="$PWD/module-root"
          cmake --build defragger/build-fat-media --parallel 2 --target defragmenter-fat-test-worker defragmenter-test-media-raw-test defragmenter-mapper-cpp defragmenter-mapper-v2-test defragmenter-fat-module-architecture-test
      - name: Create, verify and analyse real fragmented FAT12 FAT16 FAT32 media
        run: |
          set -euo pipefail
          export IFS_TEST_MODULE_PARENT="$PWD/module-root"
          export DEFRAGMENTER_FAT_WORKER="$PWD/defragger/build-fat-media/defragmenter-fat-test-worker"
          ctest --test-dir defragger/build-fat-media --output-on-failure -R '^defragmenter-fat-(module-architecture|relayout)$'
