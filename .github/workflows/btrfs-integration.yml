# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify independent BTRFS integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  btrfs-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-Btrfs
          ref: ba80a1c7d8a21476b550889091d93c28ebaa99ce
          path: ci-btrfs
      - name: Build BTRFS.so and run driver tests
        run: |
          cmake -S ci-btrfs -B /tmp/btrfs-so -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/btrfs-so --parallel 2
          ctest --test-dir /tmp/btrfs-so --output-on-failure
      - name: Compile real Defragmenter integration
        run: |
          set -euo pipefail
          cd defragger
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/build/modules" \
            -DLD_ENABLE_WERROR=ON
          cmake --build build --parallel 2 --target \
            defragmenter-btrfs-worker defragmenter-btrfs-test-worker \
            defragmenter-test-media-raw-test defragmenter-mapper-cpp
      - name: Run real Btrfs Defrag, Growth, Recover and Test Media through SO
        run: |
          set -euo pipefail
          cd defragger
          mkdir -p build/modules/Filesystems
          install -m 0644 /tmp/btrfs-so/BTRFS.so build/modules/Filesystems/BTRFS.so
          cmp native/ifs_btrfs_module_v1.h ../ci-btrfs/include/ifs_btrfs_module_v1.h
          cmp test_media/ifs_btrfs_fixture_v1.h ../ci-btrfs/include/ifs_btrfs_fixture_v1.h
          bash tests/verify_legacy_fs_services_abi.sh ../ci-btrfs/include/ifs_defrag_services_v1.h
          export IFS_TEST_MODULE_PARENT="$PWD/build/modules"
          export DEFRAGMENTER_BTRFS_WORKER="$PWD/build/defragmenter-btrfs-test-worker"
          export DEFRAGMENTER_BUILD_DIR="$PWD/build"
          "$DEFRAGMENTER_BTRFS_WORKER" --version
          python3 tests/test_btrfs_native.py
          build/defragmenter-test-media-raw-test create btrfs build/btrfs-test-media.img
          build/defragmenter-test-media-raw-test verify btrfs build/btrfs-test-media.img
          build/defragmenter-mapper build/btrfs-test-media.img --fstype btrfs --cells 8 > build/btrfs-map.json
          python3 - <<'PY'
          import json
          with open('build/btrfs-map.json',encoding='utf-8') as f:
              m=json.load(f)
          assert m['filesystem']=='btrfs',m
          assert m['map_accuracy']=='exact-single-device',m
          assert m.get('unknown_bytes',1)==0,m
          PY
      - name: Refuse missing module without modifying test media
        run: |
          set -euo pipefail
          cd defragger
          mkdir -p build/missing/Filesystems
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" \
            build/defragmenter-btrfs-test-worker --version; then
            echo "ERROR: Btrfs worker ran without BTRFS.so" >&2
            exit 1
          fi
          before="$(sha256sum build/btrfs-test-media.img)"
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" \
            build/defragmenter-test-media-raw-test recreate btrfs build/btrfs-test-media.img; then
            echo "ERROR: Btrfs test formatter ran without BTRFS.so" >&2
            exit 1
          fi
          test "$before" = "$(sha256sum build/btrfs-test-media.img)"
