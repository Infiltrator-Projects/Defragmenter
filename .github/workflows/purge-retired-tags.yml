name: Purge reviewed V2 migration archive tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/purge-retired-tags.yml']
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove only retired migration snapshot refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/git/refs/tags/archive/v2-20261110" --jq '.[].ref' | while IFS= read -r ref; do
            case "$ref" in refs/tags/archive/v2-20261110/*) ;; *) echo "unexpected ref: $ref"; exit 1;; esac
            gh api --method DELETE "repos/$REPO/git/$ref"
            printf 'Removed retired tag: %s\n' "$ref"
          done
