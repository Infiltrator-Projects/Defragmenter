# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify independent MINIX integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minix-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-Minix
          ref: d146cb736cf0e45d27e8bc0598d83bf40870d7d8
          path: ci-minix
      - name: Compile combined MINIX.so and its preserved native fixture
        run: |
          cmake -S ci-minix -B /tmp/minix-so -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/minix-so --parallel 2
          ctest --test-dir /tmp/minix-so --output-on-failure
      - name: Compile Defragmenter module host and independent fixture bridge
        run: |
          set -euo pipefail
          cd defragger
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/build/modules" \
            -DMINIX_NATIVE_FIXTURE_PATH="/tmp/minix-so/minix-native-test" \
            -DLD_ENABLE_WERROR=ON
          cmake --build build --parallel 2 --target \
            defragmenter-minix-worker defragmenter-minix-test-worker \
            defragmenter-test-media-raw-test defragmenter-mapper-cpp
      - name: Exercise Minix Defrag, Growth, Recover, Test Media and mapper
        run: |
          set -euo pipefail
          cd defragger
          mkdir -p build/modules/Filesystems
          install -m 0644 /tmp/minix-so/MINIX.so build/modules/Filesystems/MINIX.so
          cmp native/ifs_minix_defrag_v1.h ../ci-minix/include/ifs_minix_defrag_v1.h
          cmp test_media/ifs_minix_fixture_v1.h ../ci-minix/include/ifs_minix_fixture_v1.h
          bash tests/verify_legacy_fs_services_abi.sh ../ci-minix/include/ifs_defrag_services_v1.h
          export IFS_TEST_MODULE_PARENT="$PWD/build/modules"
          export DEFRAGMENTER_MINIX_WORKER="$PWD/build/defragmenter-minix-test-worker"
          export DEFRAGMENTER_MINIX_FIXTURE="/tmp/minix-so/minix-native-test"
          export DEFRAGMENTER_BUILD_DIR="$PWD/build"
          "$DEFRAGMENTER_MINIX_WORKER" --version
          python3 tests/test_minix_transaction.py
          build/defragmenter-test-media-raw-test create minix build/minix-test-media.img
          build/defragmenter-test-media-raw-test verify minix build/minix-test-media.img
          build/defragmenter-mapper build/minix-test-media.img --fstype minix --cells 8 > build/minix-map.json
          python3 - <<'PY'
          import json
          with open('build/minix-map.json',encoding='utf-8') as f:
              m=json.load(f)
          assert m['filesystem']=='minix',m
          assert m['map_accuracy']=='exact',m
          assert m.get('unknown_bytes',1)==0,m
          PY
      - name: Fail closed if independent module is absent
        run: |
          set -euo pipefail
          cd defragger
          mkdir -p build/missing/Filesystems
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" \
            build/defragmenter-minix-test-worker --version; then
            echo "ERROR: Minix worker bypassed MINIX.so" >&2
            exit 1
          fi
          before="$(sha256sum build/minix-test-media.img)"
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" \
            build/defragmenter-test-media-raw-test recreate minix build/minix-test-media.img; then
            echo "ERROR: Minix Test Media wrote without MINIX.so" >&2
            exit 1
          fi
          test "$before" = "$(sha256sum build/minix-test-media.img)"
