# Retire reviewed superseded branches without bringing V1 code back into main.
# Always preserve the exact old tip as an archive tag before removing its ref.
name: Prune integrated and superseded branches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Prune only branches entirely included in main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" != main ] || continue
            sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            [ -n "$sha" ] || continue
            encoded="$(jq -rn --arg name "$branch" '$name | @uri')"
            ahead="$(gh api "repos/$REPO/compare/main...$encoded" --jq '.ahead_by' 2>/dev/null || true)"
            [ "$ahead" = 0 ] || continue
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$current" = "$sha" ]; then
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            fi
          done
