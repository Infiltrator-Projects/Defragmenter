# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish qualified release

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact main commit that passed the project quality gate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: defragger
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          submodules: false

      - name: Verify self-hosted release runner contract
        run: ./ci/preflight.sh release

      - name: Verify release identity and completed safety audit
        id: release_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

          VERSION=$(tr -d '\r\n' < VERSION)
          test -n "$VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          subject=$(git log -1 --format=%s HEAD)
          [[ "$subject" == "Release ${VERSION}" || "$subject" == "Release ${VERSION}:"* ]] || {
            echo "Release commit subject must begin with Release ${VERSION}." >&2
            exit 1
          }

          grep -Fq 'Status: **complete**' ../docs/AUDIT_STATUS.md
          grep -Fqx "Applies to: release version ${VERSION}" ../docs/AUDIT_STATUS.md
          AUDITED_COMMIT=$(sed -n 's/^Audited source commit: \([0-9a-f]\{40\}\)$/\1/p' ../docs/AUDIT_STATUS.md)
          GOVERNANCE_COMMIT=$(sed -n 's/^Audited release-governance commit: \([0-9a-f]\{40\}\)$/\1/p' ../docs/AUDIT_STATUS.md)
          test -n "$AUDITED_COMMIT"
          test -n "$GOVERNANCE_COMMIT"
          git cat-file -e "${AUDITED_COMMIT}^{commit}"
          git cat-file -e "${GOVERNANCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$AUDITED_COMMIT" HEAD
          git merge-base --is-ancestor "$GOVERNANCE_COMMIT" HEAD
          git diff --quiet "$AUDITED_COMMIT" HEAD -- CMakeLists.txt cmake native gui src shared packaging test_media || {
            echo "Audited production/build/package source changed after ${AUDITED_COMMIT}; refresh the safety audit before release." >&2
            exit 1
          }
          git diff --quiet "$GOVERNANCE_COMMIT" HEAD -- ':(top).github/workflows' || {
            echo "Release-governance workflows changed after ${GOVERNANCE_COMMIT}; refresh the safety audit before release." >&2
            exit 1
          }

          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "${TAG}")
            test "$tag_commit" = "$EXPECTED_SHA" || {
              echo "Release tag ${TAG} points at ${tag_commit}, not the tested commit." >&2
              exit 1
            }
          fi

          release_check=$(mktemp)
          release_status=$(curl --silent --show-error --output "$release_check" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          if [ "$release_status" = 200 ]; then
            echo "Release ${TAG} already exists; published releases are immutable." >&2
            exit 1
          fi
          if [ "$release_status" != 404 ]; then
            cat "$release_check" >&2
            echo "Unable to determine whether release ${TAG} already exists (HTTP ${release_status})." >&2
            exit 1
          fi
          rm -f "$release_check"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify permanent main history protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rules=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/rules/branches/main")
          for required in deletion non_fast_forward required_linear_history; do
            jq -e --arg required "$required" 'any(.[]; .type == $required)' <<<"$rules" >/dev/null || {
              echo "main is missing permanent $required protection." >&2
              exit 1
            }
          done

      - name: Download the exact artefacts built by qualification
        uses: actions/download-artifact@v4
        with:
          name: defragmenter-release-${{ inputs.expected_sha }}
          path: defragger/release-artifacts

      - name: Verify downloaded release artefacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release_identity.outputs.version }}"
          cd release-artifacts
          sha256sum -c RELEASE_SHA256SUMS.txt
          DEB="Defragmenter-${VERSION}-amd64.deb"
          RUN="Defragmenter-${VERSION}-local-folder.run"
          test -f "$DEB"
          test -f "$RUN"
          test "$(dpkg-deb -f "$DEB" Version)" = "$VERSION"
          echo "PACKAGE=$(dpkg-deb -f "$DEB" Package)" >> "$GITHUB_ENV"

      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release_identity.outputs.version }}"
          TAG="${{ steps.release_identity.outputs.tag }}"
          cd release-artifacts

          cat > release-body.md <<BODY
          Defragmenter ${VERSION}.

          These are the exact artefacts built and tested by the self-hosted project quality gate:
          - Generic AMD64 Debian package
          - Hardware-optimised local compile-and-install program
          - SHA-256 manifest for both artefacts
          BODY

          release_payload=$(jq -n \
            --arg tag "$TAG" \
            --arg target "$EXPECTED_SHA" \
            --arg title "Defragmenter ${VERSION}" \
            --rawfile body release-body.md \
            '{tag_name:$tag,target_commitish:$target,name:$title,body:$body,draft:false,prerelease:false}')
          release_json=$(curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$release_payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
          upload_url=$(jq -er '.upload_url | split("{")[0]' <<<"$release_json")

          for asset in \
            "Defragmenter-${VERSION}-amd64.deb" \
            "Defragmenter-${VERSION}-local-folder.run" \
            "RELEASE_SHA256SUMS.txt"; do
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${asset}" \
              "${upload_url}?name=${asset}" >/dev/null
          done

          expected_assets=$(printf '%s\n%s\n%s\n' \
            "Defragmenter-${VERSION}-amd64.deb" \
            "Defragmenter-${VERSION}-local-folder.run" \
            "RELEASE_SHA256SUMS.txt" | sort)
          published_assets=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -r '.assets[].name' | sort)
          test "$published_assets" = "$expected_assets" || {
            echo "Release ${TAG} has an unexpected asset set." >&2
            exit 1
          }

      - name: Wait until the exact release is live in APT
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release_identity.outputs.version }}"
          CATALOGUE='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          PACKAGES='https://infiltrator-projects.github.io/Infiltrator-Repository/dists/beta/main/binary-amd64/Packages.gz'

          for attempt in $(seq 1 80); do
            cache_key="${GITHUB_RUN_ID}-${attempt}"
            catalogue_version=$(curl -fsSL --retry 2 --retry-delay 1 \
              -H 'Cache-Control: no-cache' "${CATALOGUE}?release=${cache_key}" 2>/dev/null \
              | jq -r '.[] | select(.id == "defragger") | (.version // empty)' \
              | head -n1 || true)

            apt_match=false
            if curl -fsSL --retry 2 --retry-delay 1 \
              -H 'Cache-Control: no-cache' "${PACKAGES}?release=${cache_key}" 2>/dev/null \
              | gzip -dc 2>/dev/null \
              | awk -v package="$PACKAGE" -v version="$VERSION" '
                  BEGIN { RS=""; FS="\n"; found=0 }
                  {
                    p=""; v=""
                    for (i=1; i<=NF; ++i) {
                      if ($i ~ /^Package: /) { p=substr($i,10) }
                      if ($i ~ /^Version: /) { v=substr($i,10) }
                    }
                    if (p == package && v == version) { found=1 }
                  }
                  END { exit(found ? 0 : 1) }
                '; then
              apt_match=true
            fi

            if [[ "$catalogue_version" == "$VERSION" && "$apt_match" == true ]]; then
              echo "Defragmenter ${VERSION} is live in the public APT repository."
              exit 0
            fi

            echo "APT publication pending (${attempt}/80): catalogue=${catalogue_version:-missing}, package=${apt_match}."
            sleep 15
          done

          echo "GitHub release exists, but the central APT repository did not advertise Defragmenter ${VERSION} within 20 minutes." >&2
          exit 1
