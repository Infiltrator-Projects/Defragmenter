# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and publish release

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact main commit that passed the project quality gate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: defragger
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    outputs:
      version: ${{ steps.release_identity.outputs.version }}
      release_sha: ${{ steps.release_identity.outputs.release_sha }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact current main release source
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"
          VERSION=$(tr -d '\r\n' < VERSION)
          test -n "$VERSION"
          grep -Fq 'Status: **complete**' ../docs/AUDIT_STATUS.md
          grep -Fqx "Applies to: release version ${VERSION}" ../docs/AUDIT_STATUS.md
          AUDITED_COMMIT=$(sed -n 's/^Audited source commit: \([0-9a-f]\{40\}\)$/\1/p' ../docs/AUDIT_STATUS.md)
          test -n "$AUDITED_COMMIT"
          git cat-file -e "${AUDITED_COMMIT}^{commit}"
          git merge-base --is-ancestor "$AUDITED_COMMIT" HEAD
          if ! git diff --quiet "$AUDITED_COMMIT" HEAD -- CMakeLists.txt cmake native gui src shared packaging; then
            echo "Audited production/build/package source changed after ${AUDITED_COMMIT}; refresh the safety audit before release." >&2
            exit 1
          fi
          GOVERNANCE_COMMIT=$(sed -n 's/^Audited release-governance commit: \([0-9a-f]\{40\}\)$/\1/p' ../docs/AUDIT_STATUS.md)
          test -n "$GOVERNANCE_COMMIT"
          git cat-file -e "${GOVERNANCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$GOVERNANCE_COMMIT" HEAD
          if ! git diff --quiet "$GOVERNANCE_COMMIT" HEAD -- ':(top).github/workflows'; then
            echo "Release-governance workflows changed after ${GOVERNANCE_COMMIT}; refresh the safety audit before release." >&2
            exit 1
          fi
          subject=$(git log -1 --format=%s "$head_commit")
          if [[ "$subject" != "Release ${VERSION}" && "$subject" != "Release ${VERSION}:"* ]]; then
            echo "Release commit subject must begin with Release ${VERSION}." >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "${TAG}")
            test "$tag_commit" = "$EXPECTED_SHA" || {
              echo "Release tag ${TAG} points at ${tag_commit}, not the tested commit." >&2
              exit 1
            }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; published releases are immutable." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify permanent main history protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rules=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main")
          for required in deletion non_fast_forward required_linear_history; do
            if ! jq -e --arg required "$required" 'any(.[]; .type == $required)' <<<"$rules" >/dev/null; then
              echo "main is missing permanent $required protection." >&2
              exit 1
            fi
          done

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev pkg-config python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs \
            libsqlite3-dev libssl-dev

      - name: Validate release packaging and local installer
        shell: bash
        run: |
          set -euo pipefail
          ./tests/test_release_artifacts.sh

      - name: Build release artefacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          LD_BUILD_TESTING=OFF ./packaging/build-deb.sh
          ./packaging/build-local-run.sh "Defragmenter-${VERSION}-local-folder.run"
          test -f "Defragmenter-${VERSION}-amd64.deb"
          test -f "Defragmenter-${VERSION}-local-folder.run"
          ./tests/test_local_installer_end_to_end.sh \
            "./Defragmenter-${VERSION}-local-folder.run"
          sha256sum \
            "Defragmenter-${VERSION}-amd64.deb" \
            "Defragmenter-${VERSION}-local-folder.run" > RELEASE_SHA256SUMS.txt

      - name: Publish immutable versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"

          VERSION=$(tr -d '\r\n' < VERSION)
          TAG="v${VERSION}"
          tag_exists=false
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "${TAG}")
            test "$tag_commit" = "$EXPECTED_SHA" || {
              echo "Release tag ${TAG} points at ${tag_commit}, not the tested commit." >&2
              exit 1
            }
            tag_exists=true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; published releases are immutable." >&2
            exit 1
          fi

          if [ "$tag_exists" = false ]; then
            git tag "$TAG" "$EXPECTED_SHA"
            git push origin "$TAG"
          fi

          cat > release-body.md <<BODY
          Defragmenter ${VERSION}.

          Verified project release artefacts:
          - Generic AMD64 Debian package
          - Hardware-optimised local compile-and-install program
          - SHA-256 manifest for both project release artefacts

          GitHub separately displays its automatic Source code (zip) and
          Source code (tar.gz) links for the immutable release tag. No duplicate
          custom source archive is uploaded.
          BODY

          gh release create "$TAG" \
            "Defragmenter-${VERSION}-amd64.deb" \
            "Defragmenter-${VERSION}-local-folder.run" \
            "RELEASE_SHA256SUMS.txt" \
            --verify-tag \
            --target "$EXPECTED_SHA" \
            --title "Defragmenter ${VERSION}" \
            --notes-file release-body.md

          expected_assets=$(printf '%s\n%s\n%s\n' \
            "Defragmenter-${VERSION}-amd64.deb" \
            "Defragmenter-${VERSION}-local-folder.run" \
            "RELEASE_SHA256SUMS.txt" | sort)
          published_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            echo "Release ${TAG} has an unexpected asset set." >&2
            exit 1
          fi

  apt-refresh:
    name: Refresh and verify APT publication
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/apt-refresh.yml
    with:
      version: ${{ needs.release.outputs.version }}
      release_sha: ${{ needs.release.outputs.release_sha }}
    secrets: inherit
