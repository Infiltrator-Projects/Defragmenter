# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish qualified release

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact main commit that passed the project quality gate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: defragger
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          submodules: false

      - name: Verify self-hosted release runner contract
        run: ./ci/preflight.sh release

      - name: Verify audited release identity
        run: ./ci/release.sh verify-source "$EXPECTED_SHA"

      - name: Verify permanent main history protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/release.sh verify-main-protection

      - name: Download exact artefacts built by qualification
        uses: actions/download-artifact@v4
        with:
          name: defragmenter-release-${{ inputs.expected_sha }}
          path: defragger/release-artifacts

      - name: Publish or resume immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/release.sh publish "$EXPECTED_SHA" release-artifacts

      - name: Observe APT propagation without invalidating the release
        continue-on-error: true
        run: ./ci/release.sh wait-apt release-artifacts
