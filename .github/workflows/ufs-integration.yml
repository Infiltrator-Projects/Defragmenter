# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify independent UFS worker integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ufs-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libgtk-3-dev \
            libssl-dev libsqlite3-dev libext2fs-dev
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-UFS2
          ref: 8f3514883827d2a72e65c2f45580e937571e0372
          path: ci-ufs
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-UFS1
          ref: 6aff3c06c6bf2d1b94fb12bc690da841e37e76a2
          path: ci-ufs1
      - name: Build and test authoritative UFS2.so
        run: |
          cmake -S ci-ufs -B /tmp/ufs-so -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ufs-so --parallel 2
          ctest --test-dir /tmp/ufs-so --output-on-failure
          cmake -S ci-ufs1 -B /tmp/ufs1-so -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ufs1-so --parallel 2
          ctest --test-dir /tmp/ufs1-so --output-on-failure
      - name: Build Defragmenter UFS module host
        run: |
          set -euo pipefail
          cd defragger
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DLD_ENABLE_WERROR=ON \
            -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/build/module-test"
          cmake --build build --target defragmenter-ufs-worker \
            defragmenter-ufs-test-worker defragmenter-test-media-mkfs-ufs-test --parallel 2
      - name: Prove actual module dispatch and absence of internal fallback
        run: |
          set -euo pipefail
          cd defragger
          cmp native/ifs_ufs_module_v1.h ../ci-ufs/include/ifs_ufs_module_v1.h
          cmp native/ifs_ufs_module_v1.h ../ci-ufs1/include/ifs_ufs_module_v1.h
          cmp native/ifs_ufs_probe_v1.h ../ci-ufs/include/ifs_ufs_probe_v1.h
          cmp native/ifs_ufs_probe_v1.h ../ci-ufs1/include/ifs_ufs_probe_v1.h
          cmp native/ifs_ufs_volume_check_v1.h ../ci-ufs/include/ifs_ufs_volume_check_v1.h
          cmp native/ifs_ufs_payload_verifier_v1.h ../ci-ufs/include/ifs_ufs_payload_verifier_v1.h
          bash tests/verify_legacy_fs_services_abi.sh ../ci-ufs/include/ifs_defrag_services_v1.h
          mkdir -p build/module-test/Filesystems build/missing/Filesystems
          install -m 0644 /tmp/ufs-so/UFS2.so build/module-test/Filesystems/UFS2.so
          install -m 0644 /tmp/ufs1-so/UFS1.so build/module-test/Filesystems/UFS1.so
          IFS_TEST_MODULE_PARENT="$PWD/build/module-test" \
            build/defragmenter-ufs-test-worker --version | grep -F 'defragmenter-ufs-worker'
          # UFS formatting and UFS worker both dispatch through the module.
          IFS_TEST_MODULE_PARENT="$PWD/build/module-test" \
            build/defragmenter-test-media-mkfs-ufs-test --help >/dev/null 2>&1 || true
          # UFS1 smoke test: magic-only disposable probe image. This verifies
          # version-specific module dispatch, not complete UFS1 disk fidelity.
          truncate -s 65536 build/ufs1-probe.img
          printf '\x54\x19\x01\x00' | dd of=build/ufs1-probe.img \
            bs=1 seek=9564 conv=notrunc status=none
          IFS_TEST_MODULE_PARENT="$PWD/build/module-test" \
            build/defragmenter-ufs-test-worker identify "$PWD/build/ufs1-probe.img" \
            | grep -F '"variant":"ufs1-le"'
          mv build/module-test/Filesystems/UFS1.so build/ufs1-missing.so
          if IFS_TEST_MODULE_PARENT="$PWD/build/module-test" \
            build/defragmenter-ufs-test-worker identify "$PWD/build/ufs1-probe.img"; then
            echo 'ERROR: UFS1 identified without its independent UFS1.so' >&2
            exit 1
          fi
          mv build/ufs1-missing.so build/module-test/Filesystems/UFS1.so
          export IFS_TEST_MODULE_PARENT="$PWD/build/module-test"
          /bin/sh tests/test_ufs_makefs.sh \
            "$PWD/build/defragmenter-test-media-mkfs-ufs-test" \
            "$PWD/build/defragmenter-ufs-test-worker"
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" \
            build/defragmenter-test-media-mkfs-ufs-test --help; then
            echo 'ERROR: UFS formatter ran without UFS2.so' >&2
            exit 1
          fi
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" \
            build/defragmenter-ufs-test-worker --version; then
            echo 'ERROR: UFS worker ran without UFS2.so' >&2
            exit 1
          fi
