# SPDX-License-Identifier: GPL-3.0-or-later
name: Forensic 1.8.0-239 source maintenance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/forensic-239.yml

permissions:
  contents: write

concurrency:
  group: forensic-239-main
  cancel-in-progress: false

jobs:
  transform:
    if: github.event.head_commit.message == 'Bootstrap forensic 1.8.0-239 maintenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs xvfb \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Apply forensic source transformation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/forensic-239.py.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/forensic-239.py.gz.b64 | gzip -d > /tmp/forensic-239.py
          python3 /tmp/forensic-239.py
          rm -f /tmp/forensic-239.py /tmp/forensic-239.py.gz.b64

      - name: Advance exact Common gitlink
        shell: bash
        run: |
          set -euo pipefail
          git -C defragger/shared/infiltratr-common fetch --depth 1 origin 7070c5812b50821fd7580101cb2289a3184f6b2c
          git -C defragger/shared/infiltratr-common checkout --detach 7070c5812b50821fd7580101cb2289a3184f6b2c
          test "$(cat defragger/shared/infiltratr-common/VERSION)" = "1.19.38"
          test "$(git -C defragger/shared/infiltratr-common rev-parse HEAD)" = "7070c5812b50821fd7580101cb2289a3184f6b2c"
          ! grep -R --line-number --fixed-strings 'g_spawn_sync' defragger/native defragger/test_media
          git diff --check

      - name: Build first-party C and C++ warnings-clean
        working-directory: defragger
        run: |
          cmake -S . -B build-forensic \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build-forensic -j2
          cmake --build build-forensic --target linux-defragger-desktop -j2

      - name: Smoke-test native GTK desktop
        working-directory: defragger
        run: |
          set +e
          xvfb-run -a timeout --signal=TERM 5s ./build-forensic/linux-defragger-desktop >forensic-desktop-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            cat forensic-desktop-smoke.log >&2
            exit 1
          fi

      - name: Run complete project suite except pending release binding
        working-directory: defragger
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-forensic
        run: |
          ctest --test-dir build-forensic --output-on-failure
          python3 tests/test_btrfs_architecture.py

      - name: Commit audited source baseline to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/forensic-239.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Forensic responsiveness and UI cleanup'
          git push origin HEAD:main
