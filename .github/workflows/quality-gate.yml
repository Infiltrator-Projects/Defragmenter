# SPDX-License-Identifier: GPL-3.0-or-later
# Source-owned filesystem modules are linked only via Common ABI V2.
# This gate never checks, links or runs the retired private V1/V3/V4/V5 APIs.
name: Project quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: defrag-v2-project-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native C/C++ and GTK build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libgtk-3-dev \
            libssl-dev libsqlite3-dev libext2fs-dev \
            binutils
      - name: Configure complete Common V2 native application
        run: |
          cmake -S defragger -B defragger/build \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/module-root"
      - name: Compile every native worker and Test Media consumer
        run: cmake --build defragger/build --parallel 2
      - name: Check strict V2 mapping and incomplete-page refusal
        run: |
          ctest --test-dir defragger/build \
            --output-on-failure \
            -R '^defragmenter-strict-common-v2-host$'
      - name: Verify generic corpus and application policy contracts
        run: |
          ctest --test-dir defragger/build --output-on-failure -R '^defragmenter-test-media-(core|corpus-contract)$'
      - name: Prove all registered missing providers refuse without modifying test media
        run: |
          ctest --test-dir defragger/build --output-on-failure -R '^defragmenter-test-media-missing-so$'
      - name: Forbid obsolete ABI recognition in built executables
        run: |
          set -euo pipefail
          test ! -e defragger/native/ifs_defrag_services_v1.h
          test ! -e defragger/native/ifs_defrag_services_v1.c
          test ! -e defragger/native/ifs_ext_module_v1.h
          for obsolete in test_media_v2_wrappers.c test_media_fat12_common.c test_media_swap_module.c test_media_amiga_dispatch.c test_media_amiga_mkfs.c; do
            test ! -e "defragger/test_media/$obsolete"
          done
          test ! -e defragger/native/ufs_test_media_module_loader.c
          if grep -REn 'ldtm_(fat_common|format_amiga|populate_amiga|verify_amiga|raw_(fat|swap|ext|mac|ntfs|xfs|btrfs|zfs|minix|exfat))' defragger/test_media; then
            echo 'Filesystem-specific media adapter reintroduced' >&2
            exit 1
          fi
          if grep -En 'ldtm_raw_(open|read|write|plan|check_data|crc32c)' \
            defragger/test_media/test_media_raw.c defragger/test_media/test_media_raw.h; then
            echo "Private physical corpus I/O reintroduced" >&2
            exit 1
          fi
          if grep -REn '"(wipefs|mkfs[^"]*|makefs)"' defragger/test_media; then
            echo "External filesystem formatter or signature clearing reintroduced" >&2
            exit 1
          fi
          for executable in \
            defragmenter-fat-worker defragmenter-apfs-worker \
            defragmenter-minix-worker defragmenter-ext-worker \
            defragmenter-ntfs-worker defragmenter-exfat-worker \
            defragmenter-affs-worker hfs_analyser \
            defragmenter-hfsplus-worker defragmenter-xfs-worker \
            defragmenter-swap-worker defragmenter-test-media; do
            exe="defragger/build/$executable"
            test -x "$exe"
            if strings -a "$exe" | grep -E \
              'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v[1345]|ifs_defrag_services_v1'; then
              echo "Legacy filesystem ABI found in $exe" >&2
              exit 1
            fi
          done
          echo "DEFRAGMENTER_ONLY_COMMON_V2_PASS"
  ufs-consumer:
    uses: ./.github/workflows/ufs-v2-consumer.yml
  ffs-consumer:
    uses: ./.github/workflows/ffs-v2-consumer.yml
