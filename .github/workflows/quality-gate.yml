# SPDX-License-Identifier: GPL-3.0-or-later
name: Project quality gate

on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Hosted project quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: defragger
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reject tracked generated state
        shell: bash
        run: |
          set -euo pipefail
          tracked_generated=$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true)
          if [ -n "$tracked_generated" ]; then
            printf '%s\n' 'Tracked generated Python state is forbidden:' >&2
            printf '%s\n' "$tracked_generated" >&2
            exit 1
          fi

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev pkg-config zip unzip \
            python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build first-party C/C++ with warnings as errors
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build -j2

      - name: Run complete native, filesystem, GUI and release test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build
        run: ctest --test-dir build --output-on-failure

      - name: Enforce remaining architecture and release invariants
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build
        run: |
          python3 tests/test_btrfs_architecture.py
          python3 tests/test_release_gate.py

  sanitizers:
    name: Hosted ASan / UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: defragger
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLD_ENABLE_WERROR=ON \
            -DLD_ENABLE_SANITIZERS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-sanitize -j2

      - name: Run sanitizer-safe native and filesystem tests
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-sanitize
        run: |
          ctest --test-dir build-sanitize --output-on-failure \
            -E linux-defragger-tests

  publish-release:
    name: Publish qualified release
    needs: [quality-gate, sanitizers]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Release ')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      expected_sha: ${{ github.sha }}
    secrets: inherit
