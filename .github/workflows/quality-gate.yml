# SPDX-License-Identifier: GPL-3.0-or-later
name: Project quality gate

on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Self-hosted project quality gate
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: defragger
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Check out pinned Infiltratr Common
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Infiltrator-Projects/Infiltrator-Libraries
          ref: 7070c5812b50821fd7580101cb2289a3184f6b2c
          path: defragger/shared/infiltratr-common
          fetch-depth: 1
          submodules: false

      - name: Provide Node.js for the pinned Python type checker
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify self-hosted runner contract
        run: ./ci/preflight.sh quality

      - name: Reject tracked generated state
        shell: bash
        run: |
          set -euo pipefail
          tracked_generated=$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true)
          if [ -n "$tracked_generated" ]; then
            printf '%s\n' 'Tracked generated Python state is forbidden:' >&2
            printf '%s\n' "$tracked_generated" >&2
            exit 1
          fi

      - name: Build first-party C/C++ with warnings as errors
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build -j2
          cmake --build build --target linux-defragger-desktop -j2

      - name: Smoke-test the shipped native GTK desktop under Xvfb
        run: |
          set +e
          xvfb-run -a timeout --signal=TERM 5s ./build/linux-defragger-desktop \
            >native-desktop-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            cat native-desktop-smoke.log >&2
            printf 'Native GTK desktop exited unexpectedly with status %s\n' "$status" >&2
            exit 1
          fi

      - name: Run complete native, filesystem, GUI and release test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build
        run: ctest --test-dir build --output-on-failure

      - name: Enforce architecture and release invariants
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build
        run: |
          python3 tests/test_btrfs_architecture.py
          python3 tests/test_release_gate.py

      - name: Build and verify release artefacts once
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'Release ')
        shell: bash
        run: |
          set -euo pipefail
          ./tests/test_release_artifacts.sh
          VERSION=$(tr -d '\r\n' < VERSION)
          LD_BUILD_TESTING=OFF ./packaging/build-deb.sh
          ./packaging/build-local-run.sh "Defragmenter-${VERSION}-local-folder.run"
          DEB="Defragmenter-${VERSION}-amd64.deb"
          RUN="Defragmenter-${VERSION}-local-folder.run"
          test -f "$DEB"
          test -f "$RUN"
          test "$(dpkg-deb -f "$DEB" Version)" = "$VERSION"
          ./tests/test_local_installer_end_to_end.sh "./${RUN}"
          sha256sum "$DEB" "$RUN" > RELEASE_SHA256SUMS.txt

      - name: Preserve exact tested release artefacts
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'Release ')
        uses: actions/upload-artifact@v4
        with:
          name: defragmenter-release-${{ github.sha }}
          path: |
            defragger/Defragmenter-*-amd64.deb
            defragger/Defragmenter-*-local-folder.run
            defragger/RELEASE_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  sanitizers:
    name: Self-hosted ASan / UBSan
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: defragger
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Check out pinned Infiltratr Common
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Infiltrator-Projects/Infiltrator-Libraries
          ref: 7070c5812b50821fd7580101cb2289a3184f6b2c
          path: defragger/shared/infiltratr-common
          fetch-depth: 1
          submodules: false

      - name: Verify self-hosted sanitizer runner contract
        run: ./ci/preflight.sh sanitizers

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLD_ENABLE_WERROR=ON \
            -DLD_ENABLE_SANITIZERS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-sanitize -j2

      - name: Run sanitizer-safe native and filesystem tests
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-sanitize
        run: |
          ctest --test-dir build-sanitize --output-on-failure \
            -E linux-defragger-tests

  publish-release:
    name: Publish qualified release
    needs: [quality-gate, sanitizers]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Release ')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      expected_sha: ${{ github.sha }}
    secrets: inherit
