# SPDX-License-Identifier: GPL-3.0-or-later
name: Local Linux / heavy qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-quality:
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: defragger
    steps:
      # BigBedroom runner services may not expose git on PATH.  checkout
      # transparently falls back to the GitHub REST archive in that case, so
      # fetch the application and its pinned Common source as two independent
      # checkouts instead of asking the fallback path to recurse submodules.
      - name: Check out exact main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Check out pinned Infiltratr Common
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Infiltrator-Projects/Infiltrator-Libraries
          ref: 7cc5de3de0e94ed2cfcff0840bbb5346eb5c9c9f
          path: defragger/shared/infiltratr-common
          fetch-depth: 1
          submodules: false

      - name: Probe local qualification dependencies
        id: local-deps
        shell: bash
        run: |
          set -u
          commands=(cmake cc c++ make dpkg-deb pkg-config zip unzip python3 makefs udisksctl pkexec)
          missing=()
          for command_name in "${commands[@]}"; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          packages=(gtk+-3.0 ext2fs sqlite3 openssl)
          missing_packages=()
          for package_name in "${packages[@]}"; do
            pkg-config --exists "$package_name" 2>/dev/null || missing_packages+=("$package_name")
          done
          python_ok=1
          python3 -c 'import gi, cairo' >/dev/null 2>&1 || python_ok=0
          if ((${#missing[@]} == 0 && ${#missing_packages[@]} == 0 && python_ok == 1)); then
            echo "available=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >>"$GITHUB_OUTPUT"
          printf "BigBedroom qualification skipped because this runner is not provisioned.\n" >&2
          ((${#missing[@]})) && printf "Missing commands: %s\n" "${missing[*]}" >&2 || true
          ((${#missing_packages[@]})) && printf "Missing pkg-config packages: %s\n" "${missing_packages[*]}" >&2 || true
          ((python_ok == 0)) && printf "Missing Python GTK test bindings.\n" >&2 || true

      - name: Record unprovisioned BigBedroom runner
        if: steps.local-deps.outputs.available != 'true'
        run: |
          printf '%s\n' 'Local heavy qualification was not executed on this runner; hosted mandatory qualification still runs for this commit.'
      - name: Build first-party C/C++ with warnings as errors
        if: steps.local-deps.outputs.available == 'true'
        run: |
          cmake -S . -B build-local \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build-local -j2
      - name: Smoke-test the shipped native GTK desktop under Xvfb
        if: steps.local-deps.outputs.available == 'true'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            printf '%s\n' 'Xvfb is not installed on this runner; the mandatory full native/filesystem suite will still run.'
            exit 0
          fi
          set +e
          xvfb-run -a timeout --signal=TERM 5s ./build-local/linux-defragger-desktop             >native-desktop-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            cat native-desktop-smoke.log >&2
            printf 'Native GTK desktop exited unexpectedly with status %s\n' "$status" >&2
            exit 1
          fi

      - name: Run local native, filesystem and GUI tests
        if: steps.local-deps.outputs.available == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-local
        run: |
          ctest --test-dir build-local --output-on-failure
      - name: Enforce architecture and release contracts
        if: steps.local-deps.outputs.available == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-local
        run: |
          python3 tests/test_architecture.py
          python3 tests/test_btrfs_architecture.py
          python3 tests/test_release_gate.py
