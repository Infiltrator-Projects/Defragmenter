# SPDX-License-Identifier: GPL-3.0-or-later
name: Local Linux / heavy qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-quality:
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: defragger
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify local qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          commands=(cmake cc c++ make dpkg-deb pkg-config zip unzip python3 makefs udisksctl pkexec)
          missing=()
          for command_name in "${commands[@]}"; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            printf 'Self-hosted runner is missing commands: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          packages=(gtk+-3.0 ext2fs sqlite3 openssl)
          missing_packages=()
          for package_name in "${packages[@]}"; do
            pkg-config --exists "$package_name" || missing_packages+=("$package_name")
          done
          if ((${#missing_packages[@]})); then
            printf 'Self-hosted runner is missing pkg-config packages: %s\n' \
              "${missing_packages[*]}" >&2
            exit 1
          fi
          python3 -c 'import gi, cairo'

      - name: Build first-party C/C++ with warnings as errors
        run: |
          cmake -S . -B build-local \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build-local -j2
      - name: Run local native, filesystem and GUI tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-local
        run: |
          ctest --test-dir build-local --output-on-failure -I 1,10
          ctest --test-dir build-local --output-on-failure -I 12,30
      - name: Enforce architecture and release contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-local
        run: |
          python3 tests/test_architecture.py
          python3 tests/test_btrfs_architecture.py
          python3 tests/test_release_gate.py
