# SPDX-License-Identifier: GPL-3.0-or-later
# No SFS-specific parsing, bitmap, relocation, journaling or formatting is
# compiled into Defragmenter's installable binaries.
name: Verify independent SFS integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sfs-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Defragmenter with exact Common
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
      - name: Checkout authoritative SFS.so
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-SFS
          ref: c0c13362692d6660fa0b62e680f9c10d3c5b6181
          path: ci-sfs
      - name: Build and run SFS module self-tests
        run: |
          cmake -S ci-sfs -B /tmp/sfs-so -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/sfs-so --parallel 2
          ctest --test-dir /tmp/sfs-so --output-on-failure
      - name: Build Defragmenter against its generic host interface
        run: |
          set -euo pipefail
          cd defragger
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DLD_ENABLE_WERROR=ON \
            -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/build/modules" \
            -DSFS_NATIVE_TEST_SOURCE_DIR="$GITHUB_WORKSPACE/ci-sfs"
          cmake --build build --parallel 2 --target \
            defragmenter-sfs-worker defragmenter-sfs-test-worker \
            defragmenter-sfs-native-test defragmenter-sfs-so-fixture-test
      - name: Run real SFS0 and SFS2 Defrag, Growth, and Recover tests
        run: |
          set -euo pipefail
          cd defragger
          install -d -m 0755 build/modules/Filesystems
          install -m 0644 /tmp/sfs-so/SFS.so build/modules/Filesystems/SFS.so
          cmp native/ifs_defrag_services_v1.h ../ci-sfs/include/ifs_defrag_services_v1.h
          cmp native/ifs_sfs_module_v1.h ../ci-sfs/include/ifs_sfs_module_v1.h
          cmp test_media/ifs_sfs_fixture_host_v1.h ../ci-sfs/include/ifs_sfs_fixture_host_v1.h
          export IFS_TEST_MODULE_PARENT="$PWD/build/modules"
          export DEFRAGMENTER_SFS_WORKER="$PWD/build/defragmenter-sfs-test-worker"
          export DEFRAGMENTER_BUILD_DIR="$PWD/build"
          ctest --test-dir build --output-on-failure -R '^defragmenter-sfs-native$'
          python3 tests/test_sfs_transaction.py
          build/defragmenter-sfs-so-fixture-test build/sfs-fixture.img
      - name: Reject missing or incompatible SFS.so before filesystem writes
        run: |
          set -euo pipefail
          cd defragger
          mkdir -p build/missing/Filesystems
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" \
            build/defragmenter-sfs-test-worker --version; then
            echo "SFS module worker fell back without its shared object" >&2
            exit 1
          fi
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" \
            build/defragmenter-sfs-so-fixture-test build/must-not-create.img; then
            echo "SFS fixture formatter fell back without SFS.so" >&2
            exit 1
          fi
          test ! -e build/must-not-create.img
