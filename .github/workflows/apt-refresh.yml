# SPDX-License-Identifier: GPL-3.0-or-later
name: Refresh Defragmenter APT publication

on:
  workflow_call:
    inputs:
      version:
        description: Released Defragmenter version
        required: true
        type: string
      release_sha:
        description: Exact released Defragmenter commit SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Released Defragmenter version (for example 1.8.0-141)
        required: true
        type: string
      release_sha:
        description: Exact released Defragmenter commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apt-refresh-defragger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      APP_ID: defragger
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Resolve immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          release_sha="${REQUESTED_SHA}"
          release_tag="v${version}"
          published_sha="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
            | jq -er 'select(.draft == false and .prerelease == false) | .target_commitish'
          )"
          test "$published_sha" = "$release_sha" || {
            echo "Published release ${release_tag} points at ${published_sha}, not ${release_sha}." >&2
            exit 1
          }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Record pull-based APT publication
        shell: bash
        run: |
          set -euo pipefail
          echo "Central APT publication is pull-based."
          echo "Infiltrator-Repository will discover this immutable GitHub release on its own schedule."
