# SPDX-License-Identifier: GPL-3.0-or-later
name: Refresh Defragmenter APT publication

on:
  workflow_call:
    inputs:
      version:
        description: Released Defragmenter version
        required: true
        type: string
      release_sha:
        description: Exact released Defragmenter commit SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Released Defragmenter version (for example 1.8.0-141)
        required: true
        type: string
      release_sha:
        description: Exact released Defragmenter commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apt-refresh-defragger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      APP_ID: defragger
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Resolve immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          release_sha="${REQUESTED_SHA}"
          release_tag="v${version}"
          published_sha="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
            | jq -er 'select(.draft == false and .prerelease == false) | .target_commitish'
          )"
          test "$published_sha" = "$release_sha" || {
            echo "Published release ${release_tag} points at ${published_sha}, not ${release_sha}." >&2
            exit 1
          }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Dispatch and verify central APT publication
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA"             '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"
          dispatched=false
          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if curl --fail-with-body --silent --show-error --request POST               --header "Authorization: Bearer $DISPATCH_TOKEN"               --header "Accept: application/vnd.github+json"               --header "X-GitHub-Api-Version: 2022-11-28"               --data "$payload"               https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "Immediate APT dispatch accepted; verifying publication."
              dispatched=true
            else
              echo "::warning::Immediate APT dispatch failed; central scheduled publication will verify this release asynchronously."
            fi
          else
            echo "::warning::APT dispatch token is unavailable; central scheduled publication will verify this release asynchronously."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'

          if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=0"               | jq -e --arg id "$APP_ID" --arg version "$VERSION"                 '.[] | select(.id == $id and .version == $version)' >/dev/null; then
            echo "APT repository already advertises $APP_ID $VERSION."
            exit 0
          fi

          if [[ "$dispatched" != true ]]; then
            echo "APT verification deferred to the central repository workflow."
            exit 0
          fi

          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt"               | jq -e --arg id "$APP_ID" --arg version "$VERSION"                 '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for immediate APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done
          echo "::error::Immediate APT dispatch was accepted, but the central repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1
