name: Defragmenter 1.8.0-240 forensic cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry Defragmenter 1.8.0-240 forensic responsiveness cleanup'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply audited native UI responsiveness cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          desktop_path = root / 'defragger/native/desktop.cpp'
          desktop = desktop_path.read_text()

          def sub_once(pattern: str, replacement: str, text: str, label: str, flags: int = 0) -> str:
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text

          # Add an owned geometry cache for static raster artwork. The allocation
          # map already has its own Cairo cache; this closes the remaining expose-time
          # bilinear scaling hot path for the hero/drive/sidebar rasters.
          struct_anchor = '''struct MapRasterCache {
              cairo_surface_t* surface = nullptr;
              int width = 0;
              int height = 0;
              int scale = 1;
              std::uint64_t generation = 0U;
          };
          '''
          if desktop.count(struct_anchor) != 1:
              raise SystemExit('MapRasterCache anchor mismatch')
          desktop = desktop.replace(struct_anchor, struct_anchor + '''
          struct RasterImageCache {
              GdkPixbuf* source = nullptr;
              GdkPixbuf* scaled = nullptr;
              int width = 0;
              int height = 0;
          };
          ''', 1)

          artwork_pattern = r'''fs::path artwork\(const char\* name\) \{.*?\n\}\n\nGtkWidget\* app_icon_image'''
          artwork_match = re.search(artwork_pattern, desktop, re.S)
          if artwork_match is None:
              raise SystemExit('artwork function anchor missing')
          artwork_block = artwork_match.group(0)
          artwork_function = artwork_block[:-len('GtkWidget* app_icon_image')]
          helper = r'''void destroy_raster_image_cache(gpointer data)
          {
              auto* cache = static_cast<RasterImageCache*>(data);
              if (cache == nullptr) return;
              if (cache->source != nullptr) g_object_unref(cache->source);
              if (cache->scaled != nullptr) g_object_unref(cache->scaled);
              delete cache;
          }

          GdkPixbuf* scaled_cover_pixbuf(
              GtkWidget* widget, const char* asset_name, const char* cache_key,
              int width, int height)
          {
              auto* cache = static_cast<RasterImageCache*>(
                  g_object_get_data(G_OBJECT(widget), cache_key));
              if (cache == nullptr) {
                  cache = new RasterImageCache();
                  g_object_set_data_full(
                      G_OBJECT(widget), cache_key, cache,
                      destroy_raster_image_cache);
              }
              if (cache->source == nullptr) {
                  const fs::path path = artwork(asset_name);
                  if (path.empty()) return nullptr;
                  GError* failure = nullptr;
                  cache->source = gdk_pixbuf_new_from_file(path.string().c_str(), &failure);
                  if (failure != nullptr) g_error_free(failure);
                  if (cache->source == nullptr) return nullptr;
              }
              if (cache->scaled != nullptr &&
                  cache->width == width && cache->height == height)
                  return cache->scaled;
              if (cache->scaled != nullptr) {
                  g_object_unref(cache->scaled);
                  cache->scaled = nullptr;
              }
              const int source_width = std::max(1, gdk_pixbuf_get_width(cache->source));
              const int source_height = std::max(1, gdk_pixbuf_get_height(cache->source));
              const double scale = std::max(
                  static_cast<double>(width) / source_width,
                  static_cast<double>(height) / source_height);
              const int scaled_width = std::max(
                  1, static_cast<int>(source_width * scale + 0.5));
              const int scaled_height = std::max(
                  1, static_cast<int>(source_height * scale + 0.5));
              cache->scaled = gdk_pixbuf_scale_simple(
                  cache->source, scaled_width, scaled_height, GDK_INTERP_BILINEAR);
              cache->width = width;
              cache->height = height;
              return cache->scaled;
          }

          '''
          desktop = desktop.replace(
              artwork_block,
              artwork_function + helper + 'GtkWidget* app_icon_image',
              1)

          new_hero = r'''gboolean draw_hero_art(GtkWidget* widget, cairo_t* cr, gpointer) {
              GtkAllocation allocation;
              gtk_widget_get_allocation(widget, &allocation);
              const int width = std::max(1, allocation.width);
              const int height = std::max(1, allocation.height);

              cairo_set_source_rgb(cr, 0.018, 0.028, 0.045);
              cairo_paint(cr);

              const int destination_width = std::max(1, width * 68 / 100);
              auto* scaled = scaled_cover_pixbuf(
                  widget, "hero-landscape.jpg", "hero-image-cache",
                  destination_width, height);
              if (scaled != nullptr) {
                  const int scaled_width = gdk_pixbuf_get_width(scaled);
                  const int scaled_height = gdk_pixbuf_get_height(scaled);
                  const double x = width - destination_width +
                                   (destination_width - scaled_width) / 2.0;
                  const double y = (height - scaled_height) / 2.0;
                  cairo_save(cr);
                  cairo_rectangle(cr, width - destination_width, 0,
                                  destination_width, height);
                  cairo_clip(cr);
                  gdk_cairo_set_source_pixbuf(cr, scaled, x, y);
                  cairo_paint(cr);
                  cairo_restore(cr);
              }

              cairo_pattern_t* veil =
                  cairo_pattern_create_linear(0.0, 0.0, width * 0.78, 0.0);
              cairo_pattern_add_color_stop_rgba(
                  veil, 0.0, 0.018, 0.028, 0.045, 1.0);
              cairo_pattern_add_color_stop_rgba(
                  veil, 0.52, 0.018, 0.028, 0.045, 0.88);
              cairo_pattern_add_color_stop_rgba(
                  veil, 1.0, 0.018, 0.028, 0.045, 0.0);
              cairo_set_source(cr, veil);
              cairo_rectangle(cr, 0, 0, width, height);
              cairo_fill(cr);
              cairo_pattern_destroy(veil);
              return FALSE;
          }

          '''
          desktop = sub_once(
              r'gboolean draw_hero_art\(GtkWidget\* widget, cairo_t\* cr, gpointer\) \{.*?\n\}\n\n(?=gboolean draw_raster_cover)',
              new_hero, desktop, 'hero function', re.S)

          new_cover = r'''gboolean draw_raster_cover(
              GtkWidget* widget, cairo_t* cr, const char* asset_name,
              const char* cache_key)
          {
              GtkAllocation allocation;
              gtk_widget_get_allocation(widget, &allocation);
              const int width = std::max(1, allocation.width);
              const int height = std::max(1, allocation.height);
              auto* scaled = scaled_cover_pixbuf(
                  widget, asset_name, cache_key, width, height);
              if (scaled == nullptr) return FALSE;
              const int scaled_width = gdk_pixbuf_get_width(scaled);
              const int scaled_height = gdk_pixbuf_get_height(scaled);
              const double x = (width - scaled_width) / 2.0;
              const double y = (height - scaled_height) / 2.0;
              cairo_save(cr);
              cairo_rectangle(cr, 0, 0, width, height);
              cairo_clip(cr);
              gdk_cairo_set_source_pixbuf(cr, scaled, x, y);
              cairo_paint(cr);
              cairo_restore(cr);
              return FALSE;
          }

          '''
          desktop = sub_once(
              r'gboolean draw_raster_cover\(.*?\n\}\n\n(?=gboolean draw_drive_art)',
              new_cover, desktop, 'raster cover function', re.S)

          if desktop.count('gtk_widget_set_size_request(header, -1, 58);') != 1:
              raise SystemExit('58 px titlebar holdover missing')
          desktop = desktop.replace(
              'gtk_widget_set_size_request(header, -1, 58);',
              'gtk_widget_set_size_request(header, -1, 44);', 1)
          if desktop.count('gtk_widget_set_size_request(sidebar_art, 210, 160);') != 1:
              raise SystemExit('210 px sidebar-art holdover missing')
          desktop = desktop.replace(
              'gtk_widget_set_size_request(sidebar_art, 210, 160);',
              'gtk_widget_set_size_request(sidebar_art, 179, 136);', 1)
          desktop_path.write_text(desktop)

          test_media_path = root / 'defragger/test_media/test_media_gui.c'
          test_media = test_media_path.read_text()
          test_media = sub_once(
              r'static void append_log\(LdtmApp \*app, const char \*text\) \{.*?\n\}\n\n(?=static const char \*display_result)',
              '''static void append_log(LdtmApp *app, const char *text) {
              GtkTextIter end;
              GtkTextView *view = GTK_TEXT_VIEW(g_object_get_data(G_OBJECT(app->log_buffer), "view"));
              gtk_text_buffer_get_end_iter(app->log_buffer, &end);
              gtk_text_buffer_insert(app->log_buffer, &end, text, -1);
              if (view != NULL) {
                  gtk_text_buffer_get_end_iter(app->log_buffer, &end);
                  gtk_text_view_scroll_to_iter(view, &end, 0.0, FALSE, 0.0, 0.0);
              }
          }

          ''', test_media, 'Test Media append_log', re.S)
          test_media = sub_once(
              r'static gboolean channel_watch\(GIOChannel \*channel, GIOCondition condition, gpointer user_data\) \{.*?\n\}\n\n(?=static void set_worker_controls)',
              '''static gboolean channel_watch(GIOChannel *channel, GIOCondition condition, gpointer user_data) {
              LdtmApp *app = (LdtmApp *)user_data;
              guint lines = 0U;
              if ((condition & (G_IO_IN | G_IO_HUP)) != 0) {
                  while (lines < 64U) {
                      gchar *line = NULL;
                      gsize length = 0U;
                      GIOStatus status = g_io_channel_read_line(channel, &line, &length, NULL, NULL);
                      if (status == G_IO_STATUS_NORMAL && line != NULL) {
                          (void)length;
                          append_log(app, line);
                          parse_worker_status(app, line);
                          g_free(line);
                          ++lines;
                          continue;
                      }
                      g_free(line);
                      if (status == G_IO_STATUS_AGAIN) return TRUE;
                      break;
                  }
                  if (lines == 64U) return TRUE;
              }
              return (condition & (G_IO_ERR | G_IO_NVAL | G_IO_HUP)) == 0;
          }

          ''', test_media, 'Test Media channel_watch', re.S)
          test_media_path.write_text(test_media)

          version = root / 'defragger/VERSION'
          if version.read_text().strip() != '1.8.0-239':
              raise SystemExit('unexpected VERSION before 1.8.0-240')
          version.write_text('1.8.0-240\n')

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text()
          marker = '## 1.8.0-239\n'
          if text.count(marker) != 1:
              raise SystemExit('1.8.0-239 changelog marker missing')
          entry = '''## 1.8.0-240

          - Cache hero, drive and sidebar raster artwork at the current widget geometry instead of bilinear-rescaling it on every GTK expose/redraw.
          - Bound Test Media child stdout/stderr processing to 64 lines per main-loop dispatch and remove per-line temporary text-mark allocation so sustained qualification output cannot monopolise the GTK thread.
          - Remove the final stale Infiltrator OS geometry holdovers: the native header widget is actually 44 px, and sidebar artwork fits inside the 195 px navigation rail instead of requesting 210 px and expanding it.
          - Reverify the dependency against current Infiltratr Common main: Common remains 1.19.38 at exact commit `7070c5812b50821fd7580101cb2289a3184f6b2c`, so no Common bump is required.
          - Keep the Python GUI/reference layer source-only for regression compatibility; shipped packages and the local installer continue to exclude Python sources and run the native C/C++ desktop.

          '''
          changelog.write_text(text.replace(marker, entry + marker, 1))
          PY

          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git rm .github/workflows/forensic-240.yml
          git add defragger/native/desktop.cpp defragger/test_media/test_media_gui.c defragger/VERSION CHANGELOG.md
          git commit -m "Complete Defragmenter 1.8.0-240 forensic responsiveness cleanup"
          CODE_SHA=$(git rev-parse HEAD)

          python3 - "$CODE_SHA" <<'PY'
          from pathlib import Path
          import re
          import sys
          sha = sys.argv[1]
          path = Path('docs/AUDIT_STATUS.md')
          text = path.read_text()
          text = text.replace('Applies to: release version 1.8.0-239',
                              'Applies to: release version 1.8.0-240', 1)
          text = re.sub(r'Audited source commit: [0-9a-f]{40}',
                        f'Audited source commit: {sha}', text, count=1)
          text = re.sub(r'Audited release-governance commit: [0-9a-f]{40}',
                        f'Audited release-governance commit: {sha}', text, count=1)
          text = text.replace('This status records the 1.8.0-239 release audit.',
                              'This status records the 1.8.0-240 release audit.', 1)
          text = text.replace('This document records the completed 1.8.0-239 release safety case',
                              'This document records the completed 1.8.0-240 release safety case', 1)
          paragraph = (
              f'The current audited production/build/Test-Media source baseline is commit `{sha}` for release version 1.8.0-240. '
              'Write-capable filesystem engines are unchanged from the qualified 1.8.0-239 storage baseline. '
              'This pass removes the remaining UI-thread redraw waste after the allocation-map cache: static hero/drive/sidebar imagery is geometry-cached, Test Media bounds child-output work per GTK dispatch, and the 58 px header / 210 px sidebar-art holdovers are aligned to the 44 px titlebar and 195 px Infiltrator OS navigation rail. '
              'The production dependency remains current Infiltratr Common 1.19.38 at exact commit `7070c5812b50821fd7580101cb2289a3184f6b2c`; current Common main is the same commit.\n\n'
          )
          text, n = re.subn(
              r'The current audited production/build/Test-Media source baseline is commit `[^`]+` for release version 1\.8\.0-239\.[^\n]*\n\n',
              paragraph, text, count=1)
          if n != 1:
              raise SystemExit('1.8.0-239 baseline paragraph missing')
          path.write_text(text)
          PY

          git add docs/AUDIT_STATUS.md
          git commit -m "Release 1.8.0-240"
          git push origin HEAD:main
