# SPDX-License-Identifier: GPL-3.0-or-later
name: Defragmenter 1.8.0-239 maintenance completion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact main with Common
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply audited maintenance and correct stale regression assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/maintenance-239b.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          maintenance = textwrap.dedent(workflow[start:end])
          exec(compile(maintenance, 'maintenance-239b-inline', 'exec'), {'__name__': '__main__'})

          test_path = Path('defragger/tests/test_gui_models.py')
          tests = test_path.read_text()
          stale = '    assert "map_palette_" in native_desktop\n'
          replacement = (
              '    assert "map_palette_" not in native_desktop\n'
              '    assert "defrag-map-raster-cache" in native_desktop\n'
          )
          if tests.count(stale) != 1:
              raise SystemExit(f'stale map-palette assertion count was {tests.count(stale)}, expected 1')
          test_path.write_text(tests.replace(stale, replacement, 1))
          PY

          git -C defragger/shared/infiltratr-common fetch --quiet origin 7070c5812b50821fd7580101cb2289a3184f6b2c
          git -C defragger/shared/infiltratr-common checkout --quiet --detach 7070c5812b50821fd7580101cb2289a3184f6b2c

          rm -f .github/workflows/forensic-239-run.yml
          rm -f .github/workflows/maintenance-239.yml
          rm -f .github/workflows/maintenance-239b.yml
          rm -f .github/workflows/maintenance-239c.yml

      - name: Install build and validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev pkg-config zip unzip \
            python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs xvfb \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Qualify exact maintained tree
        shell: bash
        working-directory: defragger
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLD_ENABLE_WERROR=ON -DBUILD_TESTING=ON
          cmake --build build -j2
          cmake --build build --target linux-defragger-desktop -j2
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH="$PWD/gui:$PWD/tests" \
          LINUX_DEFRAGGER_BUILD_DIR="$PWD/build" \
            ctest --test-dir build --output-on-failure

      - name: Publish qualified maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git restore --staged --worktree --source=HEAD .github/workflows
          git add -A
          git diff --cached --check
          test "$(cat defragger/VERSION)" = '1.8.0-239'
          test "$(cat defragger/shared/infiltratr-common/VERSION)" = '1.19.38'
          git commit -m 'Release 1.8.0-239'
          git push origin HEAD:main
