# SPDX-License-Identifier: GPL-3.0-or-later
# Exercise real Common V2 dispatch and prove private filesystem ABIs fail closed.
name: Qualify strict Common V2 filesystem map paging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: defrag-v2-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  common-v2-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libgtk-3-dev libssl-dev \
            libsqlite3-dev libext2fs-dev binutils
      - name: Configure native Common V2-only application
        run: |
          set -euo pipefail
          cmake -S defragger -B defragger/build-v2-map \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DLD_ENABLE_WERROR=ON \
            -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/defragger/build-v2-map/test-modules"
      - name: Compile the exact Common V2 consumer and all negative test providers
        run: |
          set -euo pipefail
          cmake --build defragger/build-v2-map --parallel 2 --target \
            defragmenter-operation-engine-v2-test \
            defragmenter-common-v2-test-provider \
            defragmenter-common-v2-test-no-recovery \
            defragmenter-common-v2-test-broken-map
      - name: Compile all installed workers and native Test Media
        run: |
          set -euo pipefail
          cmake --build defragger/build-v2-map --parallel 2 --target \
            defragmenter-fat-worker \
            defragmenter-apfs-worker \
            defragmenter-minix-worker \
            defragmenter-ext-worker \
            defragmenter-ntfs-worker \
            defragmenter-exfat-worker \
            defragmenter-affs-worker \
            defragmenter-hfs-worker \
            defragmenter-hfsplus-worker \
            defragmenter-xfs-worker \
            defragmenter-swap-worker \
            defragmenter-test-media \
            defragmenter-test-media-raw-test
      - name: Refuse every retired filesystem export in installed executables
        run: |
          set -euo pipefail
          for program in \
            defragmenter-fat-worker defragmenter-apfs-worker \
            defragmenter-minix-worker defragmenter-ext-worker \
            defragmenter-ntfs-worker defragmenter-exfat-worker \
            defragmenter-affs-worker defragmenter-hfs-worker \
            defragmenter-hfsplus-worker defragmenter-xfs-worker \
            defragmenter-swap-worker defragmenter-test-media; do
            path="defragger/build-v2-map/$program"
            test -x "$path"
            if strings -a "$path" | grep -E \
              'infiltrator_filesystem_.*_v1|infiltrator_filesystem_module_v[1345]|ifs_defrag_services_v1'; then
              echo "Obsolete filesystem ABI was linked into $path" >&2
              exit 1
            fi
          done
      - name: Prove genuine V2 mapping, recovery and broken-page refusal
        run: |
          set -euo pipefail
          ctest --test-dir defragger/build-v2-map \
            --output-on-failure \
            -R '^defragmenter-strict-common-v2-host$'
      - name: Refuse V1/V5-only providers in actual discovery and mutation
        run: |
          set -euo pipefail
          bash defragger/tests/check_common_v2_exclusivity.sh \
            "$PWD/defragger/build-v2-map/defragmenter-operation-engine-v2-test" \
            "$PWD/defragger"
