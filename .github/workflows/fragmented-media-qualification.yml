# SPDX-License-Identifier: GPL-3.0-or-later
name: Fragmented Test Media real Common V2 corpus qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refuse incomplete independent filesystem coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Discover independent repositories, not the retired aggregate tree.
          # A new provider requires a reviewed geometry/corpus profile and an
          # actual real-corpus job; a missing implementation is not a pass.
          gh api --paginate '/orgs/Infiltrator-Projects/repos?per_page=100' \
            --jq '.[] | select((.archived | not) and (.name | startswith("Filesystem-"))) | .full_name' \
            | LC_ALL=C sort -u > independent.txt
          awk '/^[[:space:]]*- repository: Infiltrator-Projects\/Filesystem-/ {print $3}' \
            .github/workflows/fragmented-media-qualification.yml \
            | LC_ALL=C sort -u > qualified-profiles.txt
          test -s independent.txt
          test -s qualified-profiles.txt
          LC_ALL=C comm -23 independent.txt qualified-profiles.txt > missing-profiles.txt
          printf 'Independent repositories: %s; registered real-corpus profiles: %s\n' \
            "$(wc -l < independent.txt)" "$(wc -l < qualified-profiles.txt)"
          if [ -s missing-profiles.txt ]; then
            echo 'Unregistered independent providers (no complete pass):' >&2
            cat missing-profiles.txt >&2
            exit 1
          fi
  real-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: Infiltrator-Projects/Filesystem-APFS
            format_id: apfs
            module_file: APFS.so
          - repository: Infiltrator-Projects/Filesystem-Btrfs
            format_id: btrfs
            module_file: BTRFS.so
          - repository: Infiltrator-Projects/Filesystem-exFAT
            format_id: exfat
            module_file: exFAT.so
          - repository: Infiltrator-Projects/Filesystem-EXT2
            format_id: ext2
            module_file: EXT2.so
          - repository: Infiltrator-Projects/Filesystem-EXT3
            format_id: ext3
            module_file: EXT3.so
          - repository: Infiltrator-Projects/Filesystem-EXT4
            format_id: ext4
            module_file: EXT4.so
          - repository: Infiltrator-Projects/Filesystem-FAT12
            format_id: fat12
            module_file: FAT12.so
          - repository: Infiltrator-Projects/Filesystem-FAT16
            format_id: fat16
            module_file: FAT16.so
          - repository: Infiltrator-Projects/Filesystem-FAT32
            format_id: fat32
            module_file: FAT32.so
          - repository: Infiltrator-Projects/Filesystem-FFS
            format_id: ffs
            module_file: FFS.so
          - repository: Infiltrator-Projects/Filesystem-HFS
            format_id: hfs
            module_file: HFS.so
          - repository: Infiltrator-Projects/Filesystem-HFSPlus
            format_id: hfsplus
            module_file: HFSPLUS.so
          - repository: Infiltrator-Projects/Filesystem-Minix
            format_id: minix
            module_file: MINIX.so
          - repository: Infiltrator-Projects/Filesystem-NTFS
            format_id: ntfs
            module_file: NTFS.so
          - repository: Infiltrator-Projects/Filesystem-OFS
            format_id: ofs
            module_file: OFS.so
          - repository: Infiltrator-Projects/Filesystem-PFS3
            format_id: pfs3
            module_file: PFS3.so
          - repository: Infiltrator-Projects/Filesystem-SFS
            format_id: sfs
            module_file: SFS.so
          - repository: Infiltrator-Projects/Filesystem-Swap
            format_id: swap
            module_file: SWAP.so
          - repository: Infiltrator-Projects/Filesystem-SFS2
            format_id: sfs2
            module_file: SFS2.so
          - repository: Infiltrator-Projects/Filesystem-UFS1
            format_id: ufs1
            module_file: UFS1.so
          - repository: Infiltrator-Projects/Filesystem-UFS2
            format_id: ufs2
            module_file: UFS2.so
          - repository: Infiltrator-Projects/Filesystem-XFS
            format_id: xfs
            module_file: XFS.so
          - repository: Infiltrator-Projects/Filesystem-ZFS
            format_id: zfs
            module_file: ZFS.so
          - repository: Infiltrator-Projects/Filesystem-ADFS
            format_id: adfs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-Bcachefs
            format_id: bcachefs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-BeFS
            format_id: befs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-BFS
            format_id: bfs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-CPM
            format_id: cpm
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-EFS
            format_id: efs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-F2FS
            format_id: f2fs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-Fosfat
            format_id: fosfat
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-GFS2
            format_id: gfs2
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-HPFS
            format_id: hpfs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-JFS
            format_id: jfs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-NILFS2
            format_id: nilfs2
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-OCFS2
            format_id: ocfs2
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-OMFS
            format_id: omfs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-QNX4
            format_id: qnx4
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-QNX6
            format_id: qnx6
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-ReiserFS
            format_id: reiserfs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-SysV
            format_id: sysv
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-UDF
            format_id: udf
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-VMFS
            format_id: vmfs
            module_file: auto
          - repository: Infiltrator-Projects/Filesystem-VMFS6
            format_id: vmfs6
            module_file: auto
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the native production consumers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
          cmake -S defragger -B defragger/build-media -DBUILD_TESTING=ON -DLD_ENABLE_WERROR=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build defragger/build-media --parallel 2
      - name: Install only the independently published provider on the disposable runner
        env:
          GH_TOKEN: ${{ github.token }}
          FS_REPO: ${{ matrix.repository }}
          MODULE: ${{ matrix.module_file }}
        run: |
          set -euo pipefail
          mkdir -p dist pkg
          tag=$(gh release view -R "$FS_REPO" --json tagName --jq .tagName)
          test -n "$tag"
          gh release view "$tag" -R "$FS_REPO" --json tagName,publishedAt,url
          gh release download "$tag" -R "$FS_REPO" -p '*.deb' -D dist
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          sha256sum dist/*.deb
          dpkg-deb -x dist/*.deb pkg
          # New independent packages may choose their own filename. Require
          # exactly one filesystem SO; the host validates the actual format ID.
          if [ "$MODULE" = auto ]; then
            mapfile -t modules < <(find pkg/System/Filesystems -maxdepth 1 -type f -name '*.so')
            test "${#modules[@]}" -eq 1
            MODULE=$(basename "${modules[0]}")
          fi
          sudo install -d -m 0755 /System/Filesystems
          sudo install -m 0644 "pkg/System/Filesystems/$MODULE" "/System/Filesystems/$MODULE"
          sudo env DESTDIR="" cmake --install defragger/build-media
      - name: Create and verify genuine fragmented media through the production worker
        env:
          FORMAT: ${{ matrix.format_id }}
        run: |
          set -euo pipefail
          if [ "$FORMAT" = ufs2 ]; then FORMAT=ufs; fi
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          fixture=defragger/build-media/defragmenter-test-media-raw-test
          "$fixture" preflight "$FORMAT"
          "$fixture" preflight-corpus "$FORMAT"
          "$fixture" qualify-create "$FORMAT" "$work/media.img"
          "$fixture" verify "$FORMAT" "$work/media.img"
          if [ "$FORMAT" != swap ]; then
            "$fixture" verify-corruption "$FORMAT" "$work/media.img"
          fi
          echo "REAL_COMMON_V2_TEST_MEDIA_PASS $FORMAT"
          if [ "$FORMAT" != swap ]; then
            "$fixture" qualify-defrag "$FORMAT" "$work/media.img"
            "$fixture" qualify-create "$FORMAT" "$work/growth.img"
            "$fixture" qualify-growth "$FORMAT" "$work/growth.img"
            "$fixture" preflight-mutations "$FORMAT"
            "$fixture" qualify-recovery "$FORMAT"
            echo "REAL_COMMON_V2_BOTH_MUTATIONS_PASS $FORMAT"
          fi
