name: Apply physical qualification fixes

on:
  push:
    branches:
      - fix/physical-qualification-251

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/physical-qualification-251
          fetch-depth: 0

      - name: Apply exact source and regression patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          btrfs = "defragger/gui/filesystems/btrfs/native/btrfs_native.c"
          replace_once(
              btrfs,
              '''static const RootRecord *find_root(const RootVec *roots, uint64_t objectid)\n{\n    for (size_t i = 0U; i < roots->count; ++i)\n        if (roots->items[i].objectid == objectid)\n            return &roots->items[i];\n    return NULL;\n}\n\nstatic int run_push_coalesced''',
              '''static const RootRecord *find_root(const RootVec *roots, uint64_t objectid)\n{\n    for (size_t i = 0U; i < roots->count; ++i)\n        if (roots->items[i].objectid == objectid)\n            return &roots->items[i];\n    return NULL;\n}\n\n/*\n * Btrfs reserves negative signed object IDs for internal trees.  They are\n * stored on disk in an unsigned u64, so an unsigned >= FIRST_FREE test would\n * incorrectly classify roots such as DATA_RELOC (-9) as subvolumes.\n */\nstatic bool root_is_filesystem_tree(uint64_t objectid)\n{\n    return objectid == BTRFS_FS_TREE_OBJECTID ||\n           (int64_t)objectid >= (int64_t)BTRFS_FIRST_FREE_OBJECTID;\n}\n\nstatic int run_push_coalesced''')
          replace_once(
              btrfs,
              '''        if (record->refs == 0U ||\n            (record->objectid != BTRFS_FS_TREE_OBJECTID &&\n             record->objectid < BTRFS_FIRST_FREE_OBJECTID))\n            continue;''',
              '''        if (record->refs == 0U || !root_is_filesystem_tree(record->objectid))\n            continue;''')
          replace_once(
              btrfs,
              '''        if (record->objectid >= BTRFS_FIRST_FREE_OBJECTID ||\n            record->objectid == BTRFS_QUOTA_TREE_OBJECTID) {\n            set_error(error, error_size,\n                      "Btrfs writer refuses snapshots/subvolumes and qgroup trees in the bounded subset");\n            goto fail;\n        }''',
              '''        if ((record->objectid != BTRFS_FS_TREE_OBJECTID &&\n             root_is_filesystem_tree(record->objectid)) ||\n            record->objectid == BTRFS_QUOTA_TREE_OBJECTID) {\n            set_error(error, error_size,\n                      "Btrfs writer refuses snapshots/subvolumes and qgroup trees in the bounded subset");\n            goto fail;\n        }''')

          fixture = "defragger/tests/make_btrfs_fixture.py"
          replace_once(
              fixture,
              '''CSUM_TREE = MIXED_LOGICAL + 4 * NODE\nDATA1 = 3 * 1024 * 1024''',
              '''CSUM_TREE = MIXED_LOGICAL + 4 * NODE\nDATA_RELOC_TREE = MIXED_LOGICAL + 5 * NODE\nDATA1 = 3 * 1024 * 1024''')
          replace_once(
              fixture,
              '''BTRFS_TREE_BLOCK_REF_KEY = 176\nBTRFS_EXTENT_DATA_REF_KEY = 178\nBTRFS_EXTENT_CSUM_OBJECTID = (1 << 64) - 10''',
              '''BTRFS_TREE_BLOCK_REF_KEY = 176\nBTRFS_EXTENT_DATA_REF_KEY = 178\nBTRFS_DATA_RELOC_TREE_OBJECTID = (1 << 64) - 9\nBTRFS_EXTENT_CSUM_OBJECTID = (1 << 64) - 10''')
          replace_once(
              fixture,
              '''    superblock[120:128] = le64(8 * SECTOR)''',
              '''    superblock[120:128] = le64(9 * SECTOR)''')
          replace_once(
              fixture,
              '''    superblock[217:225] = le64(8 * SECTOR)''',
              '''    superblock[217:225] = le64(9 * SECTOR)''')
          replace_once(
              fixture,
              '''            (key(5, 132, 1), root_item(FS_TREE)),\n            (key(7, 132, 1), root_item(CSUM_TREE)),''',
              '''            (key(5, 132, 1), root_item(FS_TREE)),\n            (key(7, 132, 1), root_item(CSUM_TREE)),\n            # Negative reserved IDs are internal trees, not subvolumes.\n            (key(BTRFS_DATA_RELOC_TREE_OBJECTID, 132, 1),\n             root_item(DATA_RELOC_TREE)),''')
          replace_once(
              fixture,
              '''            (key(CSUM_TREE, 169, 0), metadata_extent(7)),\n            (key(DATA1, 168, SECTOR), data_extent(256, 0)),''',
              '''            (key(CSUM_TREE, 169, 0), metadata_extent(7)),\n            (key(DATA_RELOC_TREE, 169, 0),\n             metadata_extent(BTRFS_DATA_RELOC_TREE_OBJECTID)),\n            (key(DATA1, 168, SECTOR), data_extent(256, 0)),''')
          replace_once(
              fixture,
              '''            (key(MIXED_LOGICAL, 192, MIXED_LENGTH),\n             block_group(7 * SECTOR, 5)),''',
              '''            (key(MIXED_LOGICAL, 192, MIXED_LENGTH),\n             block_group(8 * SECTOR, 5)),''')
          replace_once(
              fixture,
              '''    image[DEV_TREE:DEV_TREE + NODE] = leaf(DEV_TREE, 4, [])\n    csum_records:''',
              '''    image[DEV_TREE:DEV_TREE + NODE] = leaf(DEV_TREE, 4, [])\n    image[DATA_RELOC_TREE:DATA_RELOC_TREE + NODE] = leaf(\n        DATA_RELOC_TREE, BTRFS_DATA_RELOC_TREE_OBJECTID, []\n    )\n    csum_records:''')

          ufs = "defragger/gui/filesystems/ufs/native/ufs_native.c"
          replace_once(
              ufs,
              '''static uint64_t ufs_group_base(const LdUfsSummary *summary, uint32_t group)\n{\n    return (uint64_t)group * summary->fragments_per_group;\n}\n\nstatic int ufs_group_start''',
              '''static uint64_t ufs_group_base(const LdUfsSummary *summary, uint32_t group)\n{\n    return (uint64_t)group * summary->fragments_per_group;\n}\n\n/*\n * Cylinder-group metadata creates unavoidable physical gaps between otherwise\n * compact UFS allocations.  A forward transition to a later cylinder group is\n * therefore a natural allocation boundary, not avoidable file fragmentation.\n */\nstatic bool ufs_compact_transition(const LdUfsSummary *summary,\n                                   uint64_t previous_end, uint64_t next_start)\n{\n    if (next_start == previous_end)\n        return true;\n    if (previous_end == 0U || next_start >= summary->filesystem_fragments)\n        return false;\n    const uint64_t previous_group =\n        (previous_end - 1U) / summary->fragments_per_group;\n    const uint64_t next_group = next_start / summary->fragments_per_group;\n    return next_group > previous_group;\n}\n\nstatic int ufs_group_start''')
          replace_once(
              ufs,
              '''                if (previous && physical_fragment != previous_end)\n                    file.fragmented = true;''',
              '''                if (previous &&\n                    !ufs_compact_transition(summary, previous_end,\n                                            physical_fragment))\n                    file.fragmented = true;''')
          replace_once(
              ufs,
              '''static int choose_run(const LdUfsSummary *summary, uint8_t *blocked,\n                      uint32_t preferred_group, uint64_t data_fragments,\n                      uint64_t reserve_fragments, uint64_t *start_out,\n                      char *error, size_t error_size)\n{\n    uint64_t span = 0U;\n    if (!infiltratr_u64_add_checked(data_fragments, reserve_fragments, &span)) {\n        ufs_error(error, error_size, "UFS placement span overflows");\n        return -1;\n    }\n    if (preferred_group >= summary->cylinder_groups) {\n        ufs_error(error, error_size, "UFS preferred cylinder group is out of range");\n        return -1;\n    }\n\n    /*\n     * Preserve locality when possible by trying the file's original cylinder\n     * group first, then search every other group. UFS block pointers are\n     * filesystem-global fragment addresses; there is no validity requirement\n     * that a regular file remain in the cylinder group where it happened to\n     * live before defragmentation.\n     */\n    for (uint32_t pass = 0U; pass < summary->cylinder_groups; ++pass) {\n        uint32_t group = preferred_group;\n        if (pass != 0U) {\n            group = pass - 1U;\n            if (group >= preferred_group)\n                group++;\n        }\n        if (group >= summary->cylinder_groups)\n            continue;\n\n        const uint64_t base = ufs_group_base(summary, group);\n        if (base >= summary->filesystem_fragments)\n            continue;\n        const uint64_t remaining = summary->filesystem_fragments - base;\n        const uint64_t group_fragments =\n            remaining < summary->fragments_per_group\n                ? remaining : summary->fragments_per_group;\n        const uint64_t end = base + group_fragments;\n        for (uint64_t start = base; start < end;\n             start += summary->fragments_per_block) {\n            if (span > end - start || !run_is_clear(blocked, start, span))\n                continue;\n            for (uint64_t fragment = 0U; fragment < span; ++fragment)\n                bit_set(blocked, start + fragment, true);\n            *start_out = start;\n            return 0;\n        }\n    }\n    ufs_error(error, error_size,\n              "UFS writer cannot place a file contiguously with the requested reserve in any cylinder group");\n    return -1;\n}\n''',
              '''static int choose_run_in_group(const LdUfsSummary *summary, uint8_t *blocked,\n                               uint32_t group, uint64_t data_fragments,\n                               uint64_t reserve_fragments, uint64_t *start_out,\n                               char *error, size_t error_size)\n{\n    uint64_t span = 0U;\n    if (!infiltratr_u64_add_checked(data_fragments, reserve_fragments, &span)) {\n        ufs_error(error, error_size, "UFS placement span overflows");\n        return -1;\n    }\n    if (group >= summary->cylinder_groups) {\n        ufs_error(error, error_size, "UFS cylinder group is out of range");\n        return -1;\n    }\n    const uint64_t base = ufs_group_base(summary, group);\n    if (base >= summary->filesystem_fragments)\n        return 1;\n    const uint64_t remaining = summary->filesystem_fragments - base;\n    const uint64_t group_fragments =\n        remaining < summary->fragments_per_group\n            ? remaining : summary->fragments_per_group;\n    const uint64_t end = base + group_fragments;\n    for (uint64_t start = base; start < end;\n         start += summary->fragments_per_block) {\n        if (span > end - start || !run_is_clear(blocked, start, span))\n            continue;\n        for (uint64_t fragment = 0U; fragment < span; ++fragment)\n            bit_set(blocked, start + fragment, true);\n        *start_out = start;\n        return 0;\n    }\n    return 1;\n}\n\nstatic int choose_run(const LdUfsSummary *summary, uint8_t *blocked,\n                      uint32_t preferred_group, uint64_t data_fragments,\n                      uint64_t reserve_fragments, uint64_t *start_out,\n                      char *error, size_t error_size)\n{\n    if (preferred_group >= summary->cylinder_groups) {\n        ufs_error(error, error_size, "UFS preferred cylinder group is out of range");\n        return -1;\n    }\n    for (uint32_t pass = 0U; pass < summary->cylinder_groups; ++pass) {\n        uint32_t group = preferred_group;\n        if (pass != 0U) {\n            group = pass - 1U;\n            if (group >= preferred_group)\n                group++;\n        }\n        if (group >= summary->cylinder_groups)\n            continue;\n        const int placed = choose_run_in_group(\n            summary, blocked, group, data_fragments, reserve_fragments,\n            start_out, error, error_size);\n        if (placed <= 0)\n            return placed;\n    }\n    ufs_error(error, error_size,\n              "UFS writer cannot place a file contiguously with the requested reserve in any cylinder group");\n    return -1;\n}\n''')
          replace_once(
              ufs,
              '''            if (previous && reference->physical_fragment != end) {''',
              '''            if (previous &&\n                !ufs_compact_transition(&inventory.summary, end,\n                                        reference->physical_fragment)) {''')
          replace_once(
              ufs,
              '''        const UfsBlockRef *first = &source.blocks[file->first_block];\n        const uint32_t group = (uint32_t)(\n            first->physical_fragment / source.summary.fragments_per_group);\n        uint64_t destination = 0U;\n        if (choose_run(&source.summary, blocked, group, data_fragments, reserve,\n                       &destination, error, error_size) != 0) {\n            result = -1; break;\n        }\n        uint64_t cursor = destination;\n        for (uint32_t b = 0U; b < file->block_count; ++b) {\n            UfsBlockRef *ref = &source.blocks[file->first_block + b];\n            const uint64_t so = ref->physical_fragment *\n                (uint64_t)source.summary.fragment_size;\n            const uint64_t to = cursor *\n                (uint64_t)source.summary.fragment_size;\n            const uint64_t copy_bytes64 =\n                (uint64_t)ref->span_fragments *\n                source.summary.fragment_size;\n            if (copy_bytes64 > SIZE_MAX) {\n                ufs_error(error, error_size,\n                          "UFS file fragment span exceeds addressable I/O size");\n                result = -1;\n                break;\n            }\n            const int copied = copy_bytes(\n                source.fd, stage_fd, so, to, copy_bytes64,\n                error, error_size);\n            if (copied != 0) { result = copied; break; }\n            for (uint32_t fr = 0U; fr < ref->span_fragments; ++fr)\n                bit_set(final_free, cursor + fr, false);\n            if (write_daddr_at(stage_fd, &source.summary, ref->pointer_offset,\n                               cursor, error, error_size) != 0) {\n                result = -1; break;\n            }\n            cursor += ref->span_fragments;\n        }\n        if (result == 0 && live_updates) {\n            (void)printf(\n                "@@LIVE_RANGES {\\"ranges\\":[[%" PRIu64 ",%" PRIu64\n                ",1]],\\"sequence\\":%zu}\\n",\n                destination, destination + data_fragments, ++live_sequence);\n            (void)fflush(stdout);\n        }''',
              '''        const UfsBlockRef *first = &source.blocks[file->first_block];\n        const uint32_t preferred_group = (uint32_t)(\n            first->physical_fragment / source.summary.fragments_per_group);\n\n        bool whole_blocks = !file->sparse;\n        for (uint32_t b = 0U; b < file->block_count && whole_blocks; ++b) {\n            const UfsBlockRef *ref = &source.blocks[file->first_block + b];\n            if (ref->span_fragments != source.summary.fragments_per_block ||\n                ref->physical_fragment % source.summary.fragments_per_block != 0U)\n                whole_blocks = false;\n        }\n\n        if (whole_blocks) {\n            const size_t group_count = source.summary.cylinder_groups;\n            uint64_t *group_fragments = calloc(group_count, sizeof(*group_fragments));\n            uint64_t *group_starts = calloc(group_count, sizeof(*group_starts));\n            if (group_fragments == NULL || group_starts == NULL) {\n                free(group_fragments);\n                free(group_starts);\n                ufs_error(error, error_size,\n                          "out of memory planning UFS cylinder-group runs");\n                result = -1;\n                break;\n            }\n            uint32_t final_group = UINT32_MAX;\n            for (uint32_t b = 0U; b < file->block_count; ++b) {\n                const UfsBlockRef *ref = &source.blocks[file->first_block + b];\n                const uint64_t group64 =\n                    ref->physical_fragment / source.summary.fragments_per_group;\n                if (group64 >= source.summary.cylinder_groups ||\n                    !infiltratr_u64_add_checked(\n                        group_fragments[group64], ref->span_fragments,\n                        &group_fragments[group64])) {\n                    ufs_error(error, error_size,\n                              "UFS cylinder-group data budget overflows");\n                    result = -1;\n                    break;\n                }\n            }\n            if (result == 0) {\n                for (uint32_t group = 0U;\n                     group < source.summary.cylinder_groups; ++group)\n                    if (group_fragments[group] != 0U)\n                        final_group = group;\n                if (final_group == UINT32_MAX) {\n                    ufs_error(error, error_size,\n                              "UFS whole-block file has no allocation budget");\n                    result = -1;\n                }\n            }\n            if (result == 0) {\n                for (uint32_t group = 0U;\n                     group < source.summary.cylinder_groups; ++group) {\n                    if (group_fragments[group] == 0U)\n                        continue;\n                    const uint64_t group_reserve =\n                        group == final_group ? reserve : 0U;\n                    const int placed = choose_run_in_group(\n                        &source.summary, blocked, group, group_fragments[group],\n                        group_reserve, &group_starts[group], error, error_size);\n                    if (placed != 0) {\n                        if (placed > 0)\n                            ufs_error(error, error_size,\n                                      "UFS writer cannot compact a whole-block file within its original cylinder-group allocation budget");\n                        result = -1;\n                        break;\n                    }\n                }\n            }\n            uint32_t placement_group = 0U;\n            while (result == 0 && placement_group < source.summary.cylinder_groups &&\n                   group_fragments[placement_group] == 0U)\n                placement_group++;\n            uint64_t cursor = placement_group < source.summary.cylinder_groups\n                ? group_starts[placement_group] : 0U;\n            uint64_t remaining_in_group = placement_group < source.summary.cylinder_groups\n                ? group_fragments[placement_group] : 0U;\n            for (uint32_t b = 0U; b < file->block_count && result == 0; ++b) {\n                UfsBlockRef *ref = &source.blocks[file->first_block + b];\n                while (remaining_in_group == 0U) {\n                    placement_group++;\n                    while (placement_group < source.summary.cylinder_groups &&\n                           group_fragments[placement_group] == 0U)\n                        placement_group++;\n                    if (placement_group >= source.summary.cylinder_groups) {\n                        ufs_error(error, error_size,\n                                  "UFS cylinder-group run plan ended before the file");\n                        result = -1;\n                        break;\n                    }\n                    cursor = group_starts[placement_group];\n                    remaining_in_group = group_fragments[placement_group];\n                }\n                if (result != 0)\n                    break;\n                if (ref->span_fragments > remaining_in_group) {\n                    ufs_error(error, error_size,\n                              "UFS cylinder-group run plan splits a filesystem block");\n                    result = -1;\n                    break;\n                }\n                const uint64_t so = ref->physical_fragment *\n                    (uint64_t)source.summary.fragment_size;\n                const uint64_t to = cursor *\n                    (uint64_t)source.summary.fragment_size;\n                const uint64_t copy_bytes64 =\n                    (uint64_t)ref->span_fragments * source.summary.fragment_size;\n                const int copied = copy_bytes(\n                    source.fd, stage_fd, so, to, copy_bytes64,\n                    error, error_size);\n                if (copied != 0) { result = copied; break; }\n                for (uint32_t fr = 0U; fr < ref->span_fragments; ++fr)\n                    bit_set(final_free, cursor + fr, false);\n                if (write_daddr_at(stage_fd, &source.summary, ref->pointer_offset,\n                                   cursor, error, error_size) != 0) {\n                    result = -1;\n                    break;\n                }\n                cursor += ref->span_fragments;\n                remaining_in_group -= ref->span_fragments;\n            }\n            if (result == 0 && live_updates) {\n                for (uint32_t group = 0U;\n                     group < source.summary.cylinder_groups; ++group) {\n                    if (group_fragments[group] == 0U)\n                        continue;\n                    (void)printf(\n                        "@@LIVE_RANGES {\\"ranges\\":[[%" PRIu64 ",%" PRIu64\n                        ",1]],\\"sequence\\":%zu}\\n",\n                        group_starts[group],\n                        group_starts[group] + group_fragments[group],\n                        ++live_sequence);\n                }\n                (void)fflush(stdout);\n            }\n            free(group_fragments);\n            free(group_starts);\n        } else {\n            uint64_t destination = 0U;\n            if (choose_run(&source.summary, blocked, preferred_group,\n                           data_fragments, reserve, &destination,\n                           error, error_size) != 0) {\n                result = -1;\n                break;\n            }\n            uint64_t cursor = destination;\n            for (uint32_t b = 0U; b < file->block_count; ++b) {\n                UfsBlockRef *ref = &source.blocks[file->first_block + b];\n                const uint64_t so = ref->physical_fragment *\n                    (uint64_t)source.summary.fragment_size;\n                const uint64_t to = cursor *\n                    (uint64_t)source.summary.fragment_size;\n                const uint64_t copy_bytes64 =\n                    (uint64_t)ref->span_fragments * source.summary.fragment_size;\n                const int copied = copy_bytes(\n                    source.fd, stage_fd, so, to, copy_bytes64,\n                    error, error_size);\n                if (copied != 0) { result = copied; break; }\n                for (uint32_t fr = 0U; fr < ref->span_fragments; ++fr)\n                    bit_set(final_free, cursor + fr, false);\n                if (write_daddr_at(stage_fd, &source.summary, ref->pointer_offset,\n                                   cursor, error, error_size) != 0) {\n                    result = -1;\n                    break;\n                }\n                cursor += ref->span_fragments;\n            }\n            if (result == 0 && live_updates) {\n                (void)printf(\n                    "@@LIVE_RANGES {\\"ranges\\":[[%" PRIu64 ",%" PRIu64\n                    ",1]],\\"sequence\\":%zu}\\n",\n                    destination, destination + data_fragments, ++live_sequence);\n                (void)fflush(stdout);\n            }\n        }''')

          ufs_test = "defragger/tests/test_ufs_native.c"
          replace_once(ufs_test, '#define IMAGE_BYTES 300000', '#define IMAGE_BYTES 1000000')
          replace_once(
              ufs_test,
              '''static void test_ufs2_exact_allocation(int fd, const char *path)\n{''',
              '''static void build_multigroup_writer_fixture(int fd)\n{\n    clear_image(fd);\n    uint8_t superblock[UFS_DISK_STRUCT_BYTES];\n    memset(superblock, 0, sizeof(superblock));\n    put_le32(superblock + 8U, 8U);\n    put_le32(superblock + 12U, 16U);\n    put_le32(superblock + 16U, 80U);\n    put_le32(superblock + 20U, 96U);\n    put_le32(superblock + 44U, 2U);\n    put_le32(superblock + 48U, 8192U);\n    put_le32(superblock + 52U, 1024U);\n    put_le32(superblock + 56U, 8U);\n    put_le32(superblock + 116U, 1024U);\n    put_le32(superblock + 120U, 32U);\n    put_le32(superblock + 160U, 1024U);\n    put_le32(superblock + 184U, 64U);\n    put_le32(superblock + 188U, 160U);\n    put_le64(superblock + 1016U, 4U);\n    put_le64(superblock + 1032U, 0U);\n    put_le64(superblock + 1080U, 320U);\n    put_le64(superblock + 1088U, 128U);\n    superblock[209U] = 1U;\n    put_le32(superblock + UFS_DISK_MAGIC_OFFSET, 0x19540119U);\n    write_all(fd, superblock, sizeof(superblock), 8192);\n\n    static const uint32_t local_blocks[6] = {96U, 112U, 128U, 136U, 144U, 152U};\n    for (uint32_t group = 0U; group < 2U; ++group) {\n        uint8_t cg[1024];\n        memset(cg, 0, sizeof(cg));\n        put_le32(cg + 4U, 0x00090255U);\n        put_le32(cg + 12U, group);\n        put_le32(cg + 20U, 160U);\n        put_le32(cg + 28U, 2U);\n        put_le32(cg + 36U, 0U);\n        put_le32(cg + 92U, 168U);\n        put_le32(cg + 96U, 176U);\n        if (group == 0U)\n            cg[168U] |= (uint8_t)(1U << 2U);\n        for (uint32_t local = 96U; local < 160U; ++local) {\n            bool allocated = false;\n            for (size_t index = 0U; index < 6U; ++index) {\n                if (local >= local_blocks[index] &&\n                    local < local_blocks[index] + 8U) {\n                    allocated = true;\n                    break;\n                }\n            }\n            if (!allocated)\n                set_free(cg + 176U, local);\n        }\n        const uint64_t cg_fragment = (uint64_t)group * 160U + 16U;\n        write_all(fd, cg, sizeof(cg), (off_t)(cg_fragment * 1024U));\n    }\n\n    uint8_t inode[256];\n    memset(inode, 0, sizeof(inode));\n    put_le16(inode, UINT16_C(0100644));\n    put_le64(inode + 16U, UINT64_C(12) * UINT64_C(8192));\n    for (uint32_t block = 0U; block < 12U; ++block) {\n        const uint32_t group = block < 6U ? 0U : 1U;\n        const uint32_t local = local_blocks[block % 6U];\n        put_le64(inode + 112U + (size_t)block * 8U,\n                 (uint64_t)group * 160U + local);\n    }\n    write_all(fd, inode, sizeof(inode), (off_t)(80U * 1024U + 2U * 256U));\n\n    uint8_t block_data[8192];\n    for (uint32_t block = 0U; block < 12U; ++block) {\n        memset(block_data, (int)(0x20U + block), sizeof(block_data));\n        const uint32_t group = block < 6U ? 0U : 1U;\n        const uint64_t fragment =\n            (uint64_t)group * 160U + local_blocks[block % 6U];\n        write_all(fd, block_data, sizeof(block_data),\n                  (off_t)(fragment * 1024U));\n    }\n}\n\nstatic void test_multigroup_writer(int fd, const char *path)\n{\n    build_multigroup_writer_fixture(fd);\n    LdUfsAnalysis analysis;\n    char error[256] = {0};\n    CHECK(ufs_analyse_allocation(path, &analysis, NULL, 0U,\n                                 error, sizeof(error)) == 0);\n    CHECK(analysis.regular_files == 1U);\n    CHECK(analysis.fragmented_files == 1U);\n\n    char stage[512];\n    CHECK(snprintf(stage, sizeof(stage), "%s.ufs2-multigroup-stage", path) > 0);\n    (void)unlink(stage);\n    uint64_t commit_bytes = 0U;\n    CHECK(ufs_build_stage(path, stage, false, 10U, false, &commit_bytes,\n                          error, sizeof(error)) == 0);\n    CHECK(ufs_verify_layout(stage, false, 10U, error, sizeof(error)) == 0);\n    CHECK(ufs_analyse_allocation(stage, &analysis, NULL, 0U,\n                                 error, sizeof(error)) == 0);\n    CHECK(analysis.fragmented_files == 0U);\n    CHECK(unlink(stage) == 0);\n\n    build_multigroup_writer_fixture(fd);\n    CHECK(snprintf(stage, sizeof(stage),\n                   "%s.ufs2-multigroup-growth-stage", path) > 0);\n    (void)unlink(stage);\n    CHECK(ufs_build_stage(path, stage, true, 10U, false, &commit_bytes,\n                          error, sizeof(error)) == 0);\n    CHECK(ufs_verify_layout(stage, true, 10U, error, sizeof(error)) == 0);\n    CHECK(ufs_analyse_allocation(stage, &analysis, NULL, 0U,\n                                 error, sizeof(error)) == 0);\n    CHECK(analysis.fragmented_files == 0U);\n    CHECK(unlink(stage) == 0);\n}\n\nstatic void test_ufs2_exact_allocation(int fd, const char *path)\n{''')
