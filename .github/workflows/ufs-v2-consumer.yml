# SPDX-License-Identifier: GPL-3.0-or-later
# Contract check against the CURRENT independent UFS1/UFS2 Common V2 SOs.
# The historical UFS writer integration gate separately proves its pinned
# V1 fixture; that green result MUST NOT count as V2 consumer qualification.
name: Verify current UFS V2 universal consumer
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'defragger/native/filesystem_module_host.c'
      - 'defragger/native/filesystem_module_host.h'
      - 'defragger/native/operation_engine.cpp'
      - 'defragger/native/ufs_module_loader.c'
      - 'defragger/cmake/project.cmake'
      - '.github/workflows/ufs-v2-consumer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-ufs-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out universal Defragmenter and its pinned Common
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config jq \
            libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
      - name: Check out current authoritative UFS1.so
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Infiltrator-Projects/Filesystem-UFS1
          ref: d54178d3873ad8b7eac3546d4cabca9a5dd71a01
          path: ci-ufs1-current
      - name: Check out current authoritative UFS2.so
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Infiltrator-Projects/Filesystem-UFS2
          ref: 254d354a18defe2f15a9e5bcb42a0e922e6d818f
          path: ci-ufs2-current
      - name: Compile current V2 providers and provider-owned tests
        run: |
          set -euo pipefail
          for format in ufs1 ufs2; do
            cmake -S "ci-${format}-current" -B "/tmp/${format}-v2" \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
            cmake --build "/tmp/${format}-v2" --parallel 2
            ctest --test-dir "/tmp/${format}-v2" --output-on-failure
            so="/tmp/${format}-v2/${format^^}.so"
            nm -D "$so" | grep -F 'infiltrator_filesystem_api_v2'
            if nm -D "$so" | grep -E 'infiltrator_filesystem_.*_v1'; then
              echo "::error::Current UFS provider still exports retired filesystem V1" >&2
              exit 1
            fi
            echo "${format} current source: $(git -C "ci-${format}-current" rev-parse HEAD)"
          done
      - name: Build native disposable UFS2 media creator from the independent UFS2 repository
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -D_GNU_SOURCE -Wall -Wextra -Wpedantic -Werror \
            ci-ufs2-current/fixtures/ufs_mkfs.c -o /tmp/ufs2-native-media-creator
          test -x /tmp/ufs2-native-media-creator
      - name: Compile isolated universal Defragmenter consumer
        run: |
          set -euo pipefail
          cd defragger
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DLD_ENABLE_WERROR=ON \
            -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/build/module-test"
          cmake --build build --parallel 2 --target \
            defragmenter-operation-engine-v2-test \
            defragmenter-ufs-test-worker
      - name: Create real UFS2 media from source-owned native fixture code, not an old filesystem SO
        run: |
          set -euo pipefail
          cd defragger
          mkdir -p build/module-test/Filesystems build/test-source
          dd if=/dev/zero of=build/test-source/source.bin bs=1M count=10 status=none
          /tmp/ufs2-native-media-creator \
            -t ffs -B little -s 64m \
            -o version=2,bsize=65536,fsize=8192,minfree=5 \
            "$PWD/build/ufs2-real.img" "$PWD/build/test-source"
          test -s build/ufs2-real.img
      - name: Prove universal V2 read-only query and safe refusal
        run: |
          set -euo pipefail
          cd defragger
          install -m 0644 /tmp/ufs2-v2/UFS2.so build/module-test/Filesystems/UFS2.so
          install -m 0644 /tmp/ufs1-v2/UFS1.so build/module-test/Filesystems/UFS1.so
          export IFS_TEST_MODULE_PARENT="$PWD/build/module-test"
          consumer=build/defragmenter-operation-engine-v2-test
          image="$PWD/build/ufs2-real.img"
          "$consumer" --list-installed-modules > build/ufs-v2-inventory.json
          jq -e '.modules | any(.format_id == "ufs1" and .abi == 2)' build/ufs-v2-inventory.json
          jq -e '.modules | any(.format_id == "ufs2" and .abi == 2)' build/ufs-v2-inventory.json
          # The actual installed UFS worker must use the same current V2
          # provider, even when the historical V1 SO entry points are absent.
          worker=build/defragmenter-ufs-test-worker
          "$worker" volume-info "$image" > build/ufs2-worker-volume.json
          jq -e '.filesystem == "ufs2" and .abi == 2 and .source == "Common V2 VOLUME_QUERY"' \
            build/ufs2-worker-volume.json
          "$worker" map "$image" --path /file000 > build/ufs2-worker-map.log
          grep -Fq 'Common V2 provider operation verified' build/ufs2-worker-map.log
          if "$worker" map "$image" --path /missing-file; then
            echo "ERROR: installed UFS worker invented a missing file via V2" >&2
            exit 1
          fi
          "$consumer" volume-info "$image" --filesystem ufs2 > build/ufs2-volume.json
          jq -e '.filesystem == "ufs2" and .abi == 2 and .variant == 3
                 and .block_bytes == 65536 and .total_bytes > 0
                 and .free_bytes > 0 and .free_bytes < .total_bytes
                 and .source == "Common V2 VOLUME_QUERY"' build/ufs2-volume.json
          # Existing user-facing UFS aliases must select the actual format
          # through provider-owned Common V2 probes, not host disk decoding.
          "$consumer" volume-info "$image" --filesystem ufs > build/ufs2-auto.json
          "$consumer" volume-info "$image" --filesystem 4.2bsd > build/ufs2-bsd-alias.json
          jq -e '.filesystem == "ufs2" and .abi == 2 and .total_bytes > 0' build/ufs2-auto.json
          jq -e '.filesystem == "ufs2" and .abi == 2 and .total_bytes > 0' build/ufs2-bsd-alias.json
          "$consumer" volume-info "$image" --filesystem ufs2 \
            --sector-bytes=4096 > build/ufs2-4kn.json
          jq -e '.filesystem == "ufs2" and .total_bytes > 0' build/ufs2-4kn.json
          # The UFS2 V2 provider owns actual directory, inode and indirect
          # block decoding. This >32-extent file exercises host pagination.
          "$consumer" map "$image" --filesystem ufs2 --path / > build/ufs2-root-map.log
          "$consumer" map "$image" --filesystem ufs2 --path /file000 > build/ufs2-file-map.log
          "$consumer" map "$image" --filesystem ufs --path /file000 > build/ufs2-alias-map.log
          for record in build/ufs2-root-map.log build/ufs2-file-map.log build/ufs2-alias-map.log; do
            grep -F 'Common V2 provider operation verified' "$record"
          done
          if "$consumer" map "$image" --filesystem ufs2 --path /does-not-exist; then
            echo "ERROR: native UFS2 map invented an absent file" >&2
            exit 1
          fi
          if "$consumer" defrag "$image" --filesystem ufs2 --path /file000 \
              --write --confirm "$image"; then
            echo "ERROR: MAP-only UFS2.so qualified an unimplemented writer" >&2
            exit 1
          fi
          original="$(sha256sum "$image" | cut -d' ' -f1)"
          # Damage a genuine cylinder-group header without touching the
          # original fixture. The new V2 query must detect it, even though
          # the UFS2 superblock and its recorded totals remain intact.
          cp -- "$image" build/ufs2-corrupt-cg.img
          printf '\000\000\000\000' | dd of=build/ufs2-corrupt-cg.img \
            bs=1 seek=$((16*8192+4)) conv=notrunc status=none
          if "$consumer" volume-info "$PWD/build/ufs2-corrupt-cg.img" \
              --filesystem ufs2; then
            echo "ERROR: V2 query accepted damaged UFS2 cylinder-group header" >&2
            exit 1
          fi
          # Truncated volumes must likewise be rejected before a query can
          # claim authoritative geometry or mutate any media.
          cp -- "$image" build/ufs2-truncated.img
          truncate -s 1048576 build/ufs2-truncated.img
          if "$consumer" volume-info "$PWD/build/ufs2-truncated.img" \
              --filesystem ufs2; then
            echo "ERROR: V2 query accepted truncated UFS2 media" >&2
            exit 1
          fi
          if "$consumer" map "$image" --filesystem ufs1 --path /file000; then
            echo "ERROR: UFS1 native V2 mapper accepted a UFS2 file" >&2
            exit 1
          fi
          if "$consumer" volume-info "$image" --filesystem ufs1; then
            echo "ERROR: UFS1 accepted a real UFS2 volume" >&2; exit 1
          fi
          if "$consumer" volume-info "$image" --filesystem ufs --write; then
            echo "ERROR: auto-detected UFS accepted read-only --write" >&2
            exit 1
          fi
          if "$consumer" volume-info "$image" --filesystem ufs2 --write; then
            echo "ERROR: read-only volume-info accepted --write" >&2; exit 1
          fi
          if "$consumer" defrag "$image" --filesystem ufs2 \
            --write --confirm "$image"; then
            echo "ERROR: unqualified UFS2 DEFRAG reported success" >&2; exit 1
          fi
          test "$original" = "$(sha256sum "$image" | cut -d' ' -f1)"
          mkdir -p build/empty-v2-root/Filesystems
          # Missing V2 providers may never trigger a V1 ABI fallback.
          if IFS_TEST_MODULE_PARENT="$PWD/build/empty-v2-root" \
            "$worker" map "$image" --path /file000; then
            echo "ERROR: UFS worker fell back when native V2 SO was absent" >&2
            exit 1
          fi

          if IFS_TEST_MODULE_PARENT="$PWD/build/empty-v2-root" \
            "$consumer" volume-info "$image" --filesystem ufs2; then
            echo "ERROR: provider-less query reported success" >&2; exit 1
          fi
          test "$original" = "$(sha256sum "$image" | cut -d' ' -f1)"
          echo "Universal Common V2 UFS2 volume-info passed; unqualified mutation refused"
