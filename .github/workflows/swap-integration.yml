# SPDX-License-Identifier: GPL-3.0-or-later
# Dedicated hosted cross-repository regression. The full release gate retains
# its self-hosted runner; this guard compiles the real Defragmenter SWAP bridge.
name: Verify independent SWAP integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swap-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Defragmenter with pinned Common
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
      - name: Checkout qualified SWAP driver
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-Swap
          ref: 72e7a4ccbb20df1fa05c1b3b5b52595882072ff1
          path: ci-swap
      - name: Compile the real SWAP.so driver
        run: |
          cmake -S ci-swap -B /tmp/swap-so -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/swap-so --parallel 2
          ctest --test-dir /tmp/swap-so --output-on-failure
      - name: Compile real Defragmenter loader and Test Media
        run: |
          set -euo pipefail
          cd defragger
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/build/module-test" \
            -DLD_ENABLE_WERROR=ON
          cmake --build build --target \
            defragmenter-swap-worker defragmenter-swap-test-worker \
            defragmenter-test-media-raw-test defragmenter-mapper-cpp --parallel 2
      - name: Verify trusted module dispatch and real SWAP test media
        run: |
          set -euo pipefail
          cd defragger
          mkdir -p build/module-test/Filesystems
          install -m 0644 /tmp/swap-so/SWAP.so build/module-test/Filesystems/SWAP.so
          cmp native/ifs_swap_module_v1.h ../ci-swap/include/ifs_swap_module_v1.h
          export IFS_TEST_MODULE_PARENT="$PWD/build/module-test"
          export DEFRAGMENTER_SWAP_WORKER="$PWD/build/defragmenter-swap-test-worker"
          export DEFRAGMENTER_BUILD_DIR="$PWD/build"
          build/defragmenter-swap-test-worker --version | grep -F "defragmenter-swap-worker"
          # The full corpus contract also requires FAT12/16/32 and OFS drivers.
          # This independent gate invokes the actual SWAP fixture directly.
          build/defragmenter-test-media-raw-test create swap "$PWD/build/swap-test.img"
          build/defragmenter-test-media-raw-test verify swap "$PWD/build/swap-test.img"
          build/defragmenter-mapper "$PWD/build/swap-test.img" --fstype swap --cells 8 > build/swap-map.json
          python3 - <<'PY'
          import json
          with open("build/swap-map.json", encoding="utf-8") as f:
              result = json.load(f)
          assert result["filesystem"] == "swap", result
          assert result["map_accuracy"] == "exact", result
          assert result.get("unknown_bytes", 1) == 0, result
          print("SWAP.so create, verify and Defragmenter map passed")
          PY
      - name: Verify module is mandatory rather than falling back to internal code
        run: |
          set -euo pipefail
          cd defragger
          mkdir -p build/empty-module-root/Filesystems
          if IFS_TEST_MODULE_PARENT="$PWD/build/empty-module-root" \
            build/defragmenter-swap-test-worker --version; then
            echo "ERROR: SWAP worker ran without SWAP.so" >&2
            exit 1
          fi
          # Refusal must occur before mutating an existing media image.
          before="$(stat -c '%Y:%s' build/swap-test.img)"
          if IFS_TEST_MODULE_PARENT="$PWD/build/empty-module-root" \
            build/defragmenter-test-media-raw-test recreate swap build/swap-test.img; then
            echo "ERROR: Test Media wrote without SWAP.so" >&2
            exit 1
          fi
          test "$before" = "$(stat -c '%Y:%s' build/swap-test.img)"
