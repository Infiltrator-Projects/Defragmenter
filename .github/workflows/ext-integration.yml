# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify independent EXT2 EXT3 EXT4 integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ext-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install compiler and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-EXT4
          ref: 4ccb2d3b00a96a9b77bfe53dc8d58ab63dce3793
          path: ci-ext4
      - name: Build all three canonical shared objects
        run: |
          cmake -S ci-ext4 -B /tmp/ext-so -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DIFS_EXT_BUILD_LEGACY_MULTIFORMAT_TEST_MODULES=ON
          cmake --build /tmp/ext-so --parallel 2
          ctest --test-dir /tmp/ext-so --output-on-failure
      - name: Compile native Defragmenter loaders and Test Media
        run: |
          cd defragger
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DOFS_DEFRAG_TEST_MODULE_PARENT="$PWD/build/modules" -DLD_ENABLE_WERROR=ON
          cmake --build build --parallel 2 --target \
            defragmenter-ext-worker defragmenter-ext-test-worker defragmenter-ext-metadata-worker defragmenter-test-media-raw-test
      - name: Reject internal filesystem fallback and verify module dispatch
        run: |
          set -euo pipefail
          cd defragger
          cmp native/ifs_ext_module_v1.h ../ci-ext4/include/ifs_ext_module_v1.h
          cmp test_media/ifs_ext_fixture_v1.h ../ci-ext4/include/ifs_ext_fixture_v1.h
          cmp native/ifs_defrag_services_v1.h ../ci-ext4/include/ifs_defrag_services_v1.h
          mkdir -p build/modules/Filesystems build/missing/Filesystems
          install -m 0644 /tmp/ext-so/EXT{2,3,4}.so build/modules/Filesystems/
          export IFS_TEST_MODULE_PARENT="$PWD/build/modules"
          build/defragmenter-ext-test-worker --version | grep -F 'defragmenter-ext-worker'
          build/defragmenter-ext-metadata-worker --version | grep -F 'defragmenter-ext-worker' || true
          build/defragmenter-test-media-raw-test create ext2 build/ext2-test.img
          build/defragmenter-test-media-raw-test verify ext2 build/ext2-test.img
          build/defragmenter-ext-test-worker identify "$PWD/build/ext2-test.img" | grep -F '"ext2"'
          build/defragmenter-test-media-raw-test create ext3 build/ext3-test.img
          build/defragmenter-test-media-raw-test verify ext3 build/ext3-test.img
          build/defragmenter-ext-test-worker identify "$PWD/build/ext3-test.img" | grep -F '"ext3"'
          build/defragmenter-test-media-raw-test create ext4 build/ext4-test.img
          build/defragmenter-test-media-raw-test verify ext4 build/ext4-test.img
          build/defragmenter-ext-test-worker identify "$PWD/build/ext4-test.img" | grep -F '"ext4"'
          # Deliberately misname a valid EXT3 binary as EXT2. The loader
          # must reject the wrong module identity even when its probe
          # correctly recognises the EXT3 image. No real media is written.
          mkdir -p build/mismatch/Filesystems
          install -m 0644 /tmp/ext-so/EXT3.so build/mismatch/Filesystems/EXT2.so
          if IFS_TEST_MODULE_PARENT="$PWD/build/mismatch" \
            build/defragmenter-ext-test-worker identify "$PWD/build/ext3-test.img"; then
            echo "ERROR: EXT worker accepted EXT3.so under EXT2.so identity" >&2
            exit 1
          fi
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" build/defragmenter-ext-test-worker --version; then
            echo "ERROR: EXT worker ran without independent EXT4.so" >&2
            exit 1
          fi
          if IFS_TEST_MODULE_PARENT="$PWD/build/missing" \
            build/defragmenter-test-media-raw-test create ext2 build/missing-test.img; then
            echo "ERROR: EXT test media ran without independent EXT2.so" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-EXT2
          ref: c8f63d94e8c920c59c1c32ab4d873100c5e12966
          path: ci-independent-ext2
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-EXT3
          ref: bd6637a78531c2019e60188c9dda57538b0fbe09
          path: ci-independent-ext3
      - name: Build EXT2 and EXT3 from their own repositories, EXT4 from EXT4
        run: |
          set -euo pipefail
          for kind in ext2 ext3 ext4; do
            case "$kind" in
              ext2) src=ci-independent-ext2 ;;
              ext3) src=ci-independent-ext3 ;;
              ext4) src=ci-ext4 ;;
            esac
            cmake -S "$src" -B "/tmp/independent-$kind" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
            cmake --build "/tmp/independent-$kind" --parallel 2
            ctest --test-dir "/tmp/independent-$kind" --output-on-failure
            upper="${kind^^}"
            test -f "/tmp/independent-$kind/$upper.so"
            nm -D "/tmp/independent-$kind/$upper.so" | grep -F infiltrator_filesystem_ext_v1
          done
      - name: Verify Defragmenter actually uses three independently owned engines
        run: |
          set -euo pipefail
          cd defragger
          for src in ../ci-independent-ext2 ../ci-independent-ext3 ../ci-ext4; do
            cmp native/ifs_defrag_services_v1.h "$src/include/ifs_defrag_services_v1.h"
            cmp native/ifs_ext_module_v1.h "$src/include/ifs_ext_module_v1.h"
            cmp test_media/ifs_ext_fixture_v1.h "$src/include/ifs_ext_fixture_v1.h"
          done
          mkdir -p build/independent/Filesystems
          for kind in ext2 ext3 ext4; do
            upper="${kind^^}"
            install -m 0644 "/tmp/independent-$kind/$upper.so" "build/independent/Filesystems/$upper.so"
          done
          export IFS_TEST_MODULE_PARENT="$PWD/build/independent"
          for kind in ext2 ext3 ext4; do
            build/defragmenter-test-media-raw-test create "$kind" "build/$kind-own-repository.img"
            build/defragmenter-test-media-raw-test verify "$kind" "build/$kind-own-repository.img"
            build/defragmenter-ext-test-worker identify "$PWD/build/$kind-own-repository.img" | grep -F "\"$kind\""
          done
          # None of these operations mounts or modifies physical block devices.
